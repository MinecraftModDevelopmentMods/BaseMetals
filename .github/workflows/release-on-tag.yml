name: Upload Release Artifacts

on:
  push:
    tags:
      - '*.*.*.*'
      - 'v*.*.*.*'

env:
  JAVA_VERSION: '21'
  TAG: ${{ github.ref_name }}
  BUILD_NUMBER: ${{ github.run_number }}
  MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
  MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
  MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}

jobs:
  build:
    name: Build & Publish Maven
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Maven Release
        if: env.MAVEN_UPLOAD_URL != ''
        run: ./gradlew publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.TAG }}
          path: build/libs/*.jar

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar

  publish_github:
    name: Publish (GitHub Releases)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.TAG }}
          path: build/libs

      - name: Publish (GitHub Releases)
        id: publish_github
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ github.token }}
          files: |
            build/libs/*.jar

  publish_curseforge:
    name: Publish (CurseForge)
    needs: build
    runs-on: ubuntu-latest
    if: env.CURSEFORGE_TOKEN != ''
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.TAG }}
          path: build/libs

      - name: Publish (CurseForge)
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 240967
          loaders: neoforge
          game-versions: 1.21.1
          version: ${{ env.TAG }}
          files: |
            build/libs/!(*-@(sources|javadoc)).jar
            build/libs/*-@(sources|javadoc).jar
