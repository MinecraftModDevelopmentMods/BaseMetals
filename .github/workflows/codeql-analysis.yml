name: CodeQL

on:
  push:
    branches:
      - master-1.21.1
      - 'feature/**'
  pull_request:
    branches:
      - master-1.21.1

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 25 for Mavenizer
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Install Java 8 for the development launcher helper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install pinned Java 21 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Stage exact OreSpawn release dependency
        id: orespawn
        run: |
          mirror="$RUNNER_TEMP/orespawn-mirror"
          bash gradle/stage-orespawn-release.sh "$mirror"
          echo "repository=$mirror" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin

      - name: Compile production code
        run: |
          chmod +x ./gradlew
          ./gradlew clean classes --rerun-tasks --no-build-cache \
            -PorespawnVerificationRepository="${{ steps.orespawn.outputs.repository }}" \
            --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
