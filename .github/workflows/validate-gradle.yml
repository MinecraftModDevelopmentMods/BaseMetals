name: Validate Gradle Wrapper

on:
  push:
    branches:
      - 'master-1.21.1-neo'
      - 'feature/**'
  pull_request:
    branches:
      - 'master-1.21.1-neo'

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
