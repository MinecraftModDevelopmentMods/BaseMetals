                coordinate: curseCoordinate('mmdlib', project.mmdlib_curse_project_id, project.mmdlib_curse_file_id),
                version: project.mmdlib_version, sha256: project.mmdlib_sha256, required: true
        ],
        orespawn3: [
                coordinate: curseCoordinate('mmd-orespawn', project.orespawn3_curse_project_id, project.orespawn3_curse_file_id),
                version: project.orespawn3_version, sha256: project.orespawn3_sha256, required: true
        ],
        alt: [
                coordinate: curseCoordinate('additional-loot-tables', project.alt_curse_project_id, project.alt_curse_file_id),
                version: project.alt_version, sha256: project.alt_sha256, required: false
        ],
        mantle: [
                coordinate: curseCoordinate('mantle', project.mantle_curse_project_id, project.mantle_curse_file_id),
                version: project.mantle_version, sha256: project.mantle_sha256, required: false
        ],
        tconstruct: [
                coordinate: curseCoordinate('tinkers-construct', project.tconstruct_curse_project_id, project.tconstruct_curse_file_id),
                version: project.tconstruct_version, sha256: project.tconstruct_sha256, required: false
        ],
        conarm: [
                coordinate: curseCoordinate('constructs-armory', project.conarm_curse_project_id, project.conarm_curse_file_id),
                version: project.conarm_version, sha256: project.conarm_sha256, required: false
        ],
        thaumcraft: [
                coordinate: curseCoordinate('thaumcraft', project.thaumcraft_curse_project_id, project.thaumcraft_curse_file_id),
                version: project.thaumcraft_version, sha256: project.thaumcraft_sha256, required: false
        ],
        baubles: [
                coordinate: curseCoordinate('baubles', project.baubles_curse_project_id, project.baubles_curse_file_id),
