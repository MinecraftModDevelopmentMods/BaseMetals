import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'BaseMetals'

if (!(project.version ==~ /\d+\.\d+\.\d+\.110021/)) {
    throw new GradleException('Use Major.Minor.Patch.110021 for Minecraft 1.10.2 on Forge.')
}

// Gradle and Mavenizer use modern JDKs; the mod and game still use Java 8.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('compileTestJava', JavaCompile) { options.compilerArgs.add('-proc:none') }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}
// Mapped dependency bytes no longer match their original signatures. Keep the
// verified downloads intact and strip signatures only from renamed copies.
tasks.withType(net.minecraftforge.renamer.gradle.RenameJar).configureEach {
    additionalArgs.addAll('--strip-sigs', 'ALL', '--disable-abstract-param')
}

def textPatterns = ['cfg', 'info', 'java', 'json', 'lang', 'mcmeta', 'md', 'properties', 'txt', 'xml']
        .collect { "**/*.${it}".toString() }
def normalizeText = { details ->
    details.filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

def developmentOutput = layout.buildDirectory.dir('forge10-development/main')
def prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    group = 'ide'
    description = 'Merges production classes and processed resources for Forge 1.10 launches.'
    dependsOn tasks.named('classes')
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from sourceSets.main.output.resourcesDir
    into developmentOutput
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version
    if (gradle.startParameter.offline) mavenizerArguments.add('--offline')
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(
                    providers.gradleProperty('baseMetalsRunDirectory').getOrElse('run'))
            environment 'MC_VERSION', project.minecraft_version
            environment 'MOD_CLASSES', developmentOutput.get().asFile.absolutePath
            systemProperty 'fml.coreMods.load', project.coreplugin
            systemProperty 'log4j.skipJansi', 'true'
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'log4j.configurationFile', file('gradle/ide/log4j2.xml').toURI().toString()
            if (providers.gradleProperty('baseMetalsLaunchProbePhase').isPresent()) {
                systemProperty 'launch.phase', providers.gradleProperty('baseMetalsLaunchProbePhase').get()
            }
        }
        register('client')
        register('server') { args 'nogui' }
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn prepareDevelopmentMod
    dependsOn 'prepareJava8Launcher'
    doFirst {
        Set<File> splitOutputs = sourceSets.main.output.files.collect { it.canonicalFile } as Set<File>
        classpath = files(developmentOutput, tasks.named('prepareJava8Launcher'), classpath.filter {
            !splitOutputs.contains(it.canonicalFile) && it.name != 'slime-launcher-0.2.2.jar'
        })
        environment 'MC_VERSION', project.minecraft_version
        environment 'MOD_CLASSES', developmentOutput.get().asFile.absolutePath
    }
}

def legacyMirror = file(providers.gradleProperty('legacyDependencyVerificationRepository')
        .orElse(providers.gradleProperty('legacyDependencyRepository'))
        .getOrElse('.gradle/legacy-dependencies'))
def legacyRepository = { String remote -> legacyMirror.isDirectory() ? legacyMirror.toURI() : uri(remote) }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'VerifiedLegacyMirror'
        url = legacyMirror.toURI()
        metadataSources { artifact() }
    }
    exclusiveContent {
        forRepository { maven { url = legacyRepository('https://www.cursemaven.com'); metadataSources { artifact() } } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = legacyRepository('https://chickenbones.net/maven/'); metadataSources { artifact() } } }
        filter { includeGroup 'codechicken' }
    }
    exclusiveContent {
        forRepository { maven { url = legacyRepository('https://dvs1.progwml6.com/files/maven/'); metadataSources { artifact() } } }
        filter { includeGroup 'slimeknights'; includeGroup 'slimeknights.mantle'; includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { maven { url = legacyRepository('https://maven.ic2.player.to/'); metadataSources { artifact() } } }
        filter { includeGroup 'net.industrial-craft' }
    }
    exclusiveContent {
        forRepository { maven { url = legacyRepository('https://maven.covers1624.net/'); metadataSources { artifact() } } }
        filter { includeGroup 'cofh' }
    }
    mavenCentral()
}

apply from: 'gradle/dependencies.gradle'
renamer.mappings.from minecraft.dependency.toSrgFile

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    filesMatching('mcmod.info') { expand version: project.version, mcversion: project.minecraft_version }
    rename '(.+_at.cfg)', 'META-INF/$1'
    filesMatching(textPatterns, normalizeText)
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest.attributes(
            'Implementation-Title': 'BaseMetals', 'Implementation-Version': project.version,
            'Maven-Artifact': "${project.group}:BaseMetals:${project.version}",
            'Built-On-Java': '8', 'Built-On': "${project.minecraft_version}-${project.forge_version}",
            'FMLCorePluginContainsFMLMod': 'true', 'FMLCorePlugin': project.coreplugin)
}
['sourcesJar', 'javadocJar'].each { name ->
    tasks.named(name, Jar) { filesMatching(textPatterns, normalizeText) }
}

ext.baseMetalsBuild = [developmentOutput: developmentOutput].asImmutable()
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/verification/legacy-runtime.gradle'
apply from: 'gradle/ide/eclipse.gradle'
