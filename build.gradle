def packagedForgeServerRuntime = providers.gradleProperty('packagedForgeServerRuntime')
def packagedForgeClientRuntime = providers.gradleProperty('packagedForgeClientRuntime')
def requireRuntimeDirectory = { Provider<String> configuredPath, String propertyName ->
    if (!configuredPath.isPresent()) {
        throw new GradleException("Pass -P${propertyName}=<official Forge 25 runtime directory>")
    }
    File runtime = file(configuredPath.get()).canonicalFile
    if (!runtime.isDirectory()) {
        throw new GradleException("${propertyName} does not name a directory: ${runtime}")
    }
    runtime
}
def prepareBuildOwnedRunDirectory = { File candidate, String expectedName ->
    File runDirectory = candidate.canonicalFile
    File buildDirectory = layout.buildDirectory.get().asFile.canonicalFile
    if (!runDirectory.toPath().startsWith(buildDirectory.toPath()) || runDirectory.name != expectedName) {
        throw new GradleException("Unsafe packaged-runtime directory: ${runDirectory}")
    }
    delete runDirectory
    if (!runDirectory.mkdirs()) throw new GradleException("Could not create ${runDirectory}")
    runDirectory
}
def releasedOreSpawnJar = {
    File artifact = configurations.orespawnRelease.singleFile
    if (artifact == null || !artifact.isFile() || sha256(artifact) != configuredOreSpawnIdentity.sha256) {
        throw new GradleException('Exact released OreSpawn artifact is unavailable for packaged testing')
    }
    artifact
}
def assertPackagedRuntimePassed = { File runDirectory, String marker, String label ->
    File log = new File(runDirectory, 'logs/latest.log')
    if (!log.isFile()) throw new GradleException("${label} log is missing: ${log}")
    String contents = log.getText('UTF-8')
    if (!contents.contains(marker)) throw new GradleException("${label} did not report ${marker}")
    List<String> failures = ['Failed to load correctly', 'This crash report has been saved to',
                             'Encountered an unexpected exception', 'BASEMETALS_RUNTIME_PROBE FAIL',
                             'BASEMETALS_CLIENT_PROBE FAIL']
            .findAll { contents.contains(it) }
    if (!failures.isEmpty()) throw new GradleException("${label} failures: ${failures}")
    File crashReports = new File(runDirectory, 'crash-reports')
    if (crashReports.isDirectory() && !fileTree(crashReports).files.isEmpty()) {
        throw new GradleException("${label} created crash reports in ${crashReports}")
    }
}

