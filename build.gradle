plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'BaseMetals'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.java.srcDir 'src/dataGenerator/java'
    main.resources.srcDir 'src/generated/resources'
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

tasks.named('test') {
    enabled = false
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }
    client {}
    server {
        argument '--nogui'
    }
    data {
        systemProperty 'basemetals.projectDir', projectDir.absolutePath
        workingDirectory project.layout.projectDirectory.dir('run-data')
        arguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources').absolutePath, '--existing',
                file('src/main/resources').absolutePath
    }
}

repositories {
    mavenCentral()

    maven { url = uri('https://maven.covers1624.net/') }
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content { includeGroup 'zone.moddev.mc.orespawn' }
    }

    maven { url = uri('https://modmaven.dev/') }
    maven { url = uri('https://dvs1.progwml6.com/files/maven/') }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation 'zone.moddev.mc.orespawn:OreSpawn:4.0.16.121012'
    // API only: Mekanism remains optional at runtime. Its public slurry
    // registry is required to provide the eight historical processing chains.
    compileOnly 'mekanism:Mekanism:1.21.1-10.7.19.85:api'
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
