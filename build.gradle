def eclipseXmlEscape = { String value ->
    value.replace('&', '&amp;')
            .replace('"', '&quot;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
}

def eclipseArchiveLaunchEntry = { File archive ->
    String memento = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' \
            + '<runtimeClasspathEntry externalArchive="' + archive.canonicalPath \
            + '" type="2" path="5" />'
    '    <listEntry value="' + eclipseXmlEscape(memento) + '"/>'
}

def replaceBuildshipLaunchClasspath = { String contents, Collection<File> archives ->
    List<String> lines = contents.replace('\r\n', '\n').split('\n', -1) as List<String>
    List<Integer> buildshipLines = (0..<lines.size()).findAll {
        lines[it].contains('org.eclipse.buildship.core.gradleclasspathcontainer')
    }
    if (buildshipLines.size() != 1) {
        throw new GradleException("Expected one Buildship launch classpath entry, found ${buildshipLines.size()}")
    }
    List<File> uniqueArchives = archives.collect { it.canonicalFile }
            .unique { File archive -> archive.path.toLowerCase(Locale.ROOT) }
    List<File> missingArchives = uniqueArchives.findAll { !it.isFile() }
    if (!missingArchives.isEmpty()) {
        throw new GradleException("Eclipse launch archives are missing: ${missingArchives}")
    }
    lines[buildshipLines[0]] = uniqueArchives.collect(eclipseArchiveLaunchEntry).join('\n')
    lines.join('\n')
}

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.withXml { provider ->
            Node classpath = provider.asNode()
            classpath.classpathentry.findAll { it.@kind == 'lib' }.each {
                classpath.remove(it)
            }
            if (!classpath.classpathentry.any {
                    it.@kind == 'con' && it.@path == 'org.eclipse.buildship.core.gradleclasspathcontainer'
            }) {
                classpath.appendNode('classpathentry', [
                        kind: 'con', path: 'org.eclipse.buildship.core.gradleclasspathcontainer'
                ])
            }
        }
    }
    synchronizationTasks 'genEclipseRuns'
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Configures Buildship to use the wrapper and this invocation\'s Gradle cache.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        Map<String, String> required = [
                'eclipse.preferences.version'     : '1',
                'connection.gradle.distribution' : 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'    : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'         : '',
                'gradle.user.home'                : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'    : 'true'
        ]
        required.each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by configureEclipseBuildship.')
        }
    }
}

