import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'BaseMetals'

def eclipseWorkspaceProjectName = projectDir.name
def expectedMavenGroup = 'zone.moddev.mc.basemetals'
def expectedMavenArtifact = 'BaseMetals'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('compileTestJava', JavaCompile) { options.compilerArgs.add('-proc:none') }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = project.projectDir
}
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.java', '**/*.js', '**/*.json', '**/*.toml', '**/*.mcmeta',
                   '**/*.md', '**/*.txt', '**/*.html', '**/*.css', '**/*.properties',
                   '**/element-list', '**/package-list']) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'),
                eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
    }
}

sourceSets {
    // Build-only model generator; not part of the mod jar.
    modelGenerator {
        compileClasspath += files(tasks.named('compileJava').flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath
        runtimeClasspath += files(tasks.named('compileJava').flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath
    }
    integrationTest {
        java.setSrcDirs(['src/integrationTest/java'])
        resources.setSrcDirs(['src/integrationTest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
dependencies {
    testImplementation sourceSets.modelGenerator.output
}
configurations {
    orespawnRelease
    integrationTestImplementation.extendsFrom implementation
    integrationTestCompileOnly.extendsFrom compileOnly
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} " +
        "(${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def forgeRunModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/main')
def integrationTestModClassesDirectory = layout.buildDirectory.dir('forge-run-mod-classes/integration-test')
def forgeMainOutputPath = forgeRunModClassesDirectory.get().asFile.absolutePath
def mainModClasses = "${mod_id}%%${forgeMainOutputPath}${File.pathSeparator}${mod_id}%%${forgeMainOutputPath}"
def forgeProbeOutputPath = integrationTestModClassesDirectory.get().asFile.absolutePath
def probeModClasses = mainModClasses + "${File.pathSeparator}basemetalsprobe%%${forgeProbeOutputPath}" +
        "${File.pathSeparator}basemetalsprobe%%${forgeProbeOutputPath}"
def forge28RunTargets = [client: 'fmluserdevclient', server: 'fmluserdevserver',
        data: 'fmluserdevdata', runtimeProbeServer: 'fmluserdevserver', legacyUpgradeServer: 'fmluserdevserver']

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    runs {
        configureEach {
            // Slime Launcher calls this entry point after preparing assets and natives.
            mainClass = 'net.minecraftforge.userdev.LaunchTesting'
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            mods { basemetals { source sourceSets.main } }
            environment 'target', forge28RunTargets[name]
            environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
            environment 'MCP_VERSION', mcp_version
            environment 'FORGE_VERSION', forge_version
            environment 'FORGE_GROUP', 'net.minecraftforge'
            environment 'MC_VERSION', minecraft_version
            environment 'MOD_CLASSES', mainModClasses
        }
        register('client')
        register('server') { args '--nogui' }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
        register('runtimeProbeServer') {
            workingDir.convention layout.buildDirectory.dir('integration-test-run')
            environment 'MOD_CLASSES', probeModClasses
            args '--nogui'
        }
        register('legacyUpgradeServer') {
            workingDir.convention layout.buildDirectory.dir('legacy-upgrade-run')
            environment 'MOD_CLASSES', probeModClasses
            systemProperty 'basemetalsprobe.mode', 'legacy-upgrade'
            args '--nogui'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

def prepareForgeRunModClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into forgeRunModClassesDirectory
}
def prepareIntegrationTestModClasses = tasks.register('prepareIntegrationTestModClasses', Sync) {
    dependsOn tasks.named(sourceSets.integrationTest.classesTaskName)
    from sourceSets.integrationTest.output
    into integrationTestModClassesDirectory
}

tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    def runName = forge28RunTargets.keySet().find { runTask.name == 'run' + it.capitalize() }
    if (runName != null) {
        runTask.dependsOn prepareForgeRunModClasses
        if (runTask.name in ['runRuntimeProbeServer', 'runLegacyUpgradeServer']) {
            runTask.dependsOn prepareIntegrationTestModClasses
        }
        runTask.doFirst {
            File runDirectory = minecraft.runs.named(runName).get().workingDir.get().asFile
            File modsDirectory = new File(runDirectory, 'mods')
            if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
                throw new GradleException("Could not create development mods directory: ${modsDirectory}")
            }
        }
    }
}

def orespawnModule = "mmd-orespawn-${project.orespawn_curse_project_id}"
def orespawnVerificationRepository = project.findProperty('orespawnVerificationRepository')
def orespawnCoordinate = "curse.maven:${orespawnModule}:${orespawn_curse_file_id}"
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    exclusiveContent {
        forRepository {
            maven {
                name = orespawnVerificationRepository == null ? 'CurseMaven' : 'OreSpawnReleaseVerificationMirror'
                url = orespawnVerificationRepository == null
                        ? uri('https://www.cursemaven.com') : uri(orespawnVerificationRepository)
                metadataSources { artifact() }
            }
        }
        filter { includeModule('curse.maven', orespawnModule) }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation renamer.dependency(orespawnCoordinate)
    orespawnRelease orespawnCoordinate
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
renamer.mappings.from minecraft.dependency.toSrgFile
configurations.named('testRuntimeClasspath') {
    exclude group: 'curse.maven', module: orespawnModule
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    def replaceProperties = [minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range, forge_version: forge_version,
            forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
    from('docs') {
        exclude { it.file.name.equalsIgnoreCase('ore_textures.md') }
        into 'META-INF/basemetals/docs'
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes(['Maven-Artifact': expectedMavenCoordinate,
                'Specification-Title': 'Base Metals', 'Specification-Vendor': project.mod_authors,
                'Specification-Version': '1', 'Implementation-Title': 'Base Metals',
                'Implementation-Version': project.version, 'Implementation-Vendor': project.mod_authors,
                'Built-On-Java': '8', 'Built-On': "${project.minecraft_version}-${project.forge_version}",
                'Build-Target': "minecraft-${project.minecraft_version}-${project.loader_name}-" +
                        "${project.forge_version}-java-${project.java_version}"])
    }
}
def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
}
['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}
tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}


// Longer checks share only these artifact helpers and build paths.
ext.baseMetalsBuild = [
        expectedMavenGroup: expectedMavenGroup,
        expectedMavenArtifact: expectedMavenArtifact,
        expectedMavenCoordinate: expectedMavenCoordinate,
        eclipseWorkspaceProjectName: eclipseWorkspaceProjectName,
        prepareIntegrationTestModClasses: prepareIntegrationTestModClasses,
        releaseJar: releaseJar
]

apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/verification/development.gradle'
apply from: 'gradle/verification/generated-data.gradle'
apply from: 'gradle/ide/eclipse.gradle'
apply from: 'gradle/ide/intellij.gradle'
apply from: 'gradle/verification/packaged-forge.gradle'
