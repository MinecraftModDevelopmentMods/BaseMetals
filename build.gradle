plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

ext.mavenizerCompatibilityJar = layout.projectDirectory.file(
        'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar')
ext.mavenizerCompatibilitySha256 =
        '341B3FB10ABA6EA7DC612FBE519DC290A1C81867AED5DD320ACD783688AC49DE'

ext.mavenizerFixtureChecksums = [
        'minecraft-mavenizer-0.5.21-orespawn-compat.jar': mavenizerCompatibilitySha256,
        'minecraft-source-compatibility.json': '33A3217261EBB8F37D45F50BD2F8CE70B221C014A5C15F4C5F8F9091AD6D1EC8',
        'minecraft-mavenizer-0.5.21-orespawn-compat.patch': 'D856190DEF5574716C5E4F4379912C451B1F5952B0B111576651A98EECF58544',
        'LICENSE-MAVENIZER.txt': '20C17D8B8C48A600800DFD14F95D5CB9FF47066A9641DDEAB48DC54AEC96E331'
]
// Mavenizer runs during configuration, so verify its inputs before configuring Forge.
mavenizerFixtureChecksums.each { name, expected ->
    File fixture = file("ci-fixtures/tools/${name}")
    if (!fixture.isFile() || java.security.MessageDigest.getInstance('SHA-256')
            .digest(fixture.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
        throw new GradleException("Missing or altered Mavenizer fixture: ${name}")
    }
}

// OreSpawn's sealed Mavenizer fixture fixes duplicate record accessors in
// Forge 45's decompiled sources. It is build tooling, not part of the mod.
fgtools.configure('mavenizer') {
    classpath.from(mavenizerCompatibilityJar)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

version = project.mod_version
group = project.mod_group
base.archivesName = 'BaseMetals'

// Eclipse imports this nested checkout under its stable folder name. Keep the
// generated project and Forge launches aligned with that workspace identity.
def eclipseWorkspaceProjectName = projectDir.name
eclipse {
    project { name = eclipseWorkspaceProjectName }
}
def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('compileTestJava', JavaCompile) {
    options.compilerArgs.add('-proc:none')
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}

// Validation-only client code is kept out of the published mod.  ForgeGradle
// adds this source set to the client run only when the integrated-world smoke
// is explicitly requested.
sourceSets {
    optionalMods {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        runtimeClasspath += sourceSets.main.output
    }
    dataGenerator {
        java.srcDir 'src/dataGenerator/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gameTestValidation {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integratedSmoke {
        java.srcDir 'src/integratedSmoke/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    packagedClientSmoke {
        java.srcDir 'src/packagedClientSmoke/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.integratedSmoke.output
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.integratedSmoke.output
    }
    upgradeSmoke {
        java.srcDir 'src/upgradeSmoke/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    packagedServerSmoke {
        java.srcDir 'src/packagedServerSmoke/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    optionalModsImplementation.extendsFrom implementation
    dataGeneratorImplementation.extendsFrom implementation
    dataGeneratorCompileOnly.extendsFrom compileOnly
    dataGeneratorRuntimeOnly.extendsFrom runtimeOnly
    orespawnRelease
    gameTestValidationImplementation.extendsFrom implementation
    gameTestValidationCompileOnly.extendsFrom compileOnly
    gameTestValidationRuntimeOnly.extendsFrom runtimeOnly
    integratedSmokeImplementation.extendsFrom implementation
    integratedSmokeCompileOnly.extendsFrom compileOnly
    integratedSmokeRuntimeOnly.extendsFrom runtimeOnly
    packagedClientSmokeImplementation.extendsFrom implementation
    packagedClientSmokeCompileOnly.extendsFrom compileOnly
    packagedClientSmokeRuntimeOnly.extendsFrom runtimeOnly
    upgradeSmokeImplementation.extendsFrom implementation
    upgradeSmokeCompileOnly.extendsFrom compileOnly
    upgradeSmokeRuntimeOnly.extendsFrom runtimeOnly
    packagedServerSmokeImplementation.extendsFrom implementation
    packagedServerSmokeCompileOnly.extendsFrom compileOnly
    packagedServerSmokeRuntimeOnly.extendsFrom runtimeOnly
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    if (gradle.startParameter.offline) mavenizerArguments.add('--cache-only')
    // Use the official mappings for the selected Minecraft target.
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            with(sourceSets.optionalMods) {
                workingDir.set(layout.projectDirectory.dir('run-optional-mods'))
            }
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'

            // Keep registry diagnostics available in development logs.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            systemProperty 'forge.logging.console.level', 'debug'

            systemProperty 'forge.enabledGameTestNamespaces', mod_id

            if (providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
                systemProperty 'orespawn.worldgenBenchmarkMode', providers.gradleProperty('orespawnBenchmarkMode').get()
                systemProperty 'orespawn.worldgenBenchmarkRadius',
                        providers.gradleProperty('orespawnBenchmarkRadius').getOrElse('8')
                systemProperty 'orespawn.worldgenBenchmarkRepetitions',
                        providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse('5')
                systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
                        providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
                systemProperty 'orespawn.worldgenBenchmarkOreAudit',
                        providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
                systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                        providers.gradleProperty('orespawnBenchmarkBlockAudit').getOrElse('')
                systemProperty 'orespawn.worldgenBenchmarkCenterX',
                        providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse('1024')
                systemProperty 'orespawn.worldgenBenchmarkCenterZ',
                        providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse('1024')
                systemProperty 'orespawn.worldgenBenchmarkCenterStep',
                        providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
                systemProperty 'orespawn.worldgenBenchmarkDimension',
                        providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
                systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
            }
            if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
                jvmArgs "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (providers.gradleProperty('integratedWorldSmoke').isPresent()) {
                workingDir.set(layout.projectDirectory.dir('run-integrated-smoke'))
                systemProperty 'basemetals.integratedWorldSmoke', 'true'
                systemProperty 'basemetals.integratedWorldSmokeName',
                        providers.gradleProperty('integratedWorldSmokeName').getOrElse('basemetals-integrated-smoke')
                mods {
                    "${mod_id}" {
                        source sourceSets.integratedSmoke
                    }
                }
            }
        }

        server {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (providers.gradleProperty('upgradeWorldSmoke').isPresent()
                    || providers.gradleProperty('legacyWorldSmoke').isPresent()) {
                workingDir.convention layout.projectDirectory.dir('run-upgrade')
                systemProperty 'fml.doNotBackup', 'true'
                systemProperty 'fml.queryResult', 'confirm'
                if (providers.gradleProperty('upgradeWorldSmoke').isPresent()) {
                    systemProperty 'basemetals.upgradeWorldSmoke', 'true'
                    if (providers.gradleProperty('upgradeWorldName').isPresent()) {
                        args '--world', providers.gradleProperty('upgradeWorldName').get()
                    }
                } else {
                    systemProperty 'basemetals.legacyWorldSmoke', 'true'
                    if (providers.gradleProperty('legacyWorldName').isPresent()) {
                        args '--world', providers.gradleProperty('legacyWorldName').get()
                    }
                }
                mods {
                    "${mod_id}" {
                        source sourceSets.upgradeSmoke
                    }
                }
            }
            args '--nogui'
        }

        // Runs the isolated validation source set and exits when the suite completes.
        gameTestServer {
            workingDir.set(layout.projectDirectory.dir('run-gametest'))
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.gameTestValidation
                }
            }
        }

        data {
            workingDir.convention layout.projectDirectory.dir('run-data')
            systemProperty 'basemetals.projectDir', projectDir.absolutePath
            mods { "${mod_id}" { source sourceSets.dataGenerator } }
            // Generate into build output. Only generateResources updates the checked-in files.
            args '--mod', mod_id, '--all', '--output', file('build/generated-verification'), '--existing', file('src/main/resources/')
        }
    }
}

// Forge expects each mod's classes and resources under one physical root.
// These merged development outputs also keep validation-only classes out of
// ordinary client/server runs and every distributable archive.
def registerRunModOutput = { String taskName, SourceSet validationSourceSet ->
    def outputDirectory = layout.buildDirectory.dir("forge-run-mod-classes/${taskName}")
    tasks.register(taskName, Sync) {
        group = 'ide'
        dependsOn tasks.named(sourceSets.main.classesTaskName)
        from sourceSets.main.output
        if (validationSourceSet != null) {
            dependsOn tasks.named(validationSourceSet.classesTaskName)
            from validationSourceSet.output
        }
        into outputDirectory
    }
    [task: tasks.named(taskName), directory: outputDirectory]
}

def productionRunMod = registerRunModOutput('prepareDevelopmentMod', null)
def dataRunMod = registerRunModOutput('prepareDataDevelopmentMod', sourceSets.dataGenerator)
def gameTestRunMod = registerRunModOutput('prepareGameTestDevelopmentMod', sourceSets.gameTestValidation)
def integratedRunMod = registerRunModOutput('prepareIntegratedSmokeDevelopmentMod', sourceSets.integratedSmoke)
def upgradeRunMod = registerRunModOutput('prepareUpgradeSmokeDevelopmentMod', sourceSets.upgradeSmoke)

tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    def selected = productionRunMod
    if (runTask.name == 'runData') {
        selected = dataRunMod
    } else if (runTask.name == 'runGameTestServer') {
        selected = gameTestRunMod
    } else if (runTask.name in ['runClient', 'runOptionalModsClient']
            && providers.gradleProperty('integratedWorldSmoke').isPresent()) {
        selected = integratedRunMod
    } else if (runTask.name == 'runServer' && (providers.gradleProperty('upgradeWorldSmoke').isPresent()
            || providers.gradleProperty('legacyWorldSmoke').isPresent())) {
        selected = upgradeRunMod
    }
    runTask.dependsOn selected.task
    runTask.environment 'MOD_CLASSES', "${mod_id}%%${selected.directory.get().asFile}"
    runTask.doFirst {
        File modsDirectory = new File(runTask.workingDir, 'mods')
        if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
            throw new GradleException("Could not create development mods directory: ${modsDirectory}")
        }
    }
}

tasks.register('runClientOptionalMods') {
    group = 'forgegradle runs'
    description = 'Runs the client in a separate folder for optional-mod testing.'
    dependsOn 'runOptionalModsClient'
}

// Generated resources are checked in; the local cache is never packaged.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

// Keep the top-level build readable; each script owns one build concern.
apply from: 'gradle/dependencies.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/verification/support.gradle'
apply from: 'gradle/verification/packaged-runtime.gradle'
apply from: 'gradle/ide/eclipse.gradle'
