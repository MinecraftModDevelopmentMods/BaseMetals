import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'BaseMetals'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}

def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

def expectedMavenGroup = 'zone.moddev.mc.basemetals'
def expectedMavenArtifact = 'BaseMetals'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xmaxerrs', '1000'])
}

tasks.named('compileTestJava', JavaCompile) {
    options.compilerArgs.add('-proc:none')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = project.projectDir
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

def developmentModOutput = layout.buildDirectory.dir('forge12-development/main')
def prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    group = 'ide'
    description = 'Merges production classes and resources for Forge 1.12 development discovery.'
    dependsOn tasks.named('classes')
    from(tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory })
    from(sourceSets.main.output.resourcesDir)
    into(developmentModOutput)
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version
    // ForgeGradle launches Mavenizer as a child process, so Gradle's offline
    // flag must be forwarded explicitly to prevent network access there too.
    if (gradle.startParameter.offline) {
        mavenizerArguments.add('--offline')
    }
    String configuredRunDirectory = providers.gradleProperty('baseMetalsRunDirectory').getOrElse('run')

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.doNotBackup', 'true'
            systemProperty 'fml.queryResult', 'confirm'
            systemProperty 'log4j.skipJansi', 'true'
            environment 'MC_VERSION', project.minecraft_version
            environment 'MOD_CLASSES', developmentModOutput.get().asFile.absolutePath
            mods {
                basemetals {
                    source sourceSets.main
                }
            }
        }
        register('client') {
            if (project.hasProperty('mc_username')) {
                args '--username', project.mc_username
            }
            if (project.hasProperty('mc_uuid')) {
                args '--uuid', project.mc_uuid
            }
        }
        register('server') {
            args '--nogui'
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn prepareDevelopmentMod
    doFirst {
        Set<File> splitProductionOutputs = sourceSets.main.output.files.collect {
            it.canonicalFile
        } as Set<File>
        File mergedOutput = developmentModOutput.get().asFile
        setClasspath(project.files(
                mergedOutput,
                classpath.files.findAll { !splitProductionOutputs.contains(it.canonicalFile) }))
        environment 'MC_VERSION', project.minecraft_version
        environment 'MOD_CLASSES', mergedOutput.absolutePath
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    // CurseForge files belong only in the verified CI mirror or CurseMaven.
    exclusiveContent {
        forRepository {
            maven {
                def verificationRepository = providers.gradleProperty('legacyDependencyVerificationRepository')
                name = verificationRepository.isPresent() ? 'LegacyDependencyVerificationMirror' : 'CurseMaven'
                url = verificationRepository.isPresent()
                        ? uri(verificationRepository.get()) : uri('https://www.cursemaven.com')
                metadataSources { artifact() }
            }
        }
        filter { includeGroup('curse.maven') }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

apply from: 'gradle/dependencies.gradle'
apply from: 'gradle/data/recipe-advancements.gradle'
apply from: 'gradle/data/gameplay-advancements.gradle'

// Use readable stable_39 names in development. Reobfuscate the release jar
// back to SRG names so it works in a normal Forge installation.
renamer.mappings.from minecraft.dependency.toSrgFile

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.mod_version)
    inputs.property('mcversion', project.minecraft_version)

    filesMatching('mcmod.info') {
        expand version: project.mod_version, mcversion: project.minecraft_version
    }
    rename '(.+_at.cfg)', 'META-INF/$1'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    includeEmptyDirs = false
    manifest {
        attributes([
                'Maven-Artifact'        : expectedMavenCoordinate,
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Built-On-Java'         : '8',
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${expectedMavenCoordinate}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching('**/*.html') {
        filter { line -> line.replaceFirst(/^ +(?=[^<].*&nbsp;.*(?:,|\)<\/pre>)$)/, '    ') }
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${expectedMavenCoordinate}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        artifacts.clear()
    }
    artifacts {
        add(configurationName, releaseJar)
    }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

ext.baseMetalsBuild = [
        mavenGroup         : expectedMavenGroup,
        mavenArtifact      : expectedMavenArtifact,
        mavenCoordinate    : expectedMavenCoordinate,
        archiveTextSuffixes: archiveTextSuffixes,
        releaseJar         : releaseJar
].asImmutable()

// Build details are split by purpose: data, release checks, runtime tests, and Eclipse.
apply from: 'gradle/verification/support.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/verification/packaged-forge.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/ide/eclipse.gradle'
apply from: 'gradle/verification/workflows.gradle'
