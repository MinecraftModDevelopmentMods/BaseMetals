def verifyGeneratedData = tasks.register('verifyGeneratedData', Exec) {
    group = 'verification'
    description = 'Regenerates and proves that the committed Minecraft 1.13.2 resource projection is current.'
    commandLine 'node', 'tools/generate_113_resources.js'
    def snapshot = {
        Map<String, String> result = new TreeMap<>()
        [file('src/generated/resources'),
         file('src/main/resources/data/basemetals/orespawn/provider.json')].each { File root ->
            if (root.isFile()) {
                result[project.relativePath(root).replace('\\', '/')] = sha256(root)
            } else if (root.isDirectory()) {
                fileTree(root) { exclude '.cache/**' }.files.findAll { it.isFile() }.each { File generated ->
                    result[project.relativePath(generated).replace('\\', '/')] = sha256(generated)
                }
            }
        }
        result
    }
    doFirst { ext.beforeGeneration = snapshot() }
    doLast {
        Map<String, String> afterGeneration = snapshot()
        if (ext.beforeGeneration != afterGeneration) {
            Set<String> beforePaths = ext.beforeGeneration.keySet()
            Set<String> afterPaths = afterGeneration.keySet()
            List<String> added = (afterPaths - beforePaths).toList().sort()
            List<String> removed = (beforePaths - afterPaths).toList().sort()
            List<String> changed = (beforePaths.intersect(afterPaths)).findAll {
                ext.beforeGeneration[it] != afterGeneration[it]
            }.toList().sort()
            throw new GradleException('Generated resources were stale. Commit the generator output. ' +
                    "Added=${added.take(20)}, removed=${removed.take(20)}, changed=${changed.take(20)}")
        }
    }
}
