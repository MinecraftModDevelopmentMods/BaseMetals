configurations {
    orespawn3Development {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    legacyDependencyArtifacts {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    legacyBaselineArtifact {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    orespawn4CompatibilityArtifact {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def mmdlibDevelopmentDependency = renamer.dependency(dependencySpecs.mmdlib.coordinate)
def orespawn3DevelopmentDependency = renamer.dependency(dependencySpecs.orespawn3.coordinate)

def sanitizedOrespawn3DevelopmentJar = tasks.register('sanitizedOrespawn3DevelopmentJar', Jar) {
    group = 'ide'
    description = 'Removes stale release signatures from the MCP-remapped OreSpawn 3 development jar.'
    inputs.files(configurations.orespawn3Development)
    archiveFileName = "OreSpawn-${project.orespawn3_version}-development.jar"
    destinationDirectory = layout.buildDirectory.dir('development-dependencies')
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        configurations.orespawn3Development.files.collect { dependency -> zipTree(dependency) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    implementation mmdlibDevelopmentDependency
    orespawn3Development orespawn3DevelopmentDependency
    compileOnly files(sanitizedOrespawn3DevelopmentJar.flatMap { it.archiveFile })
    runtimeOnly files(sanitizedOrespawn3DevelopmentJar.flatMap { it.archiveFile })

    compileOnly renamer.dependency(dependencySpecs.alt.coordinate)
    compileOnly renamer.dependency(dependencySpecs.mantle.coordinate)
    compileOnly renamer.dependency(dependencySpecs.tconstruct.coordinate)
    compileOnly renamer.dependency(dependencySpecs.conarm.coordinate)
    compileOnly renamer.dependency(dependencySpecs.thaumcraft.coordinate)
    compileOnly renamer.dependency(dependencySpecs.baubles.coordinate)
    compileOnly renamer.dependency(dependencySpecs.cofhcore.coordinate)

    dependencySpecs.each { name, spec ->
        legacyDependencyArtifacts spec.coordinate
    }
    legacyBaselineArtifact curseCoordinate('base-metals',
            project.legacy_basemetals_curse_project_id,
            project.legacy_basemetals_curse_file_id)
    orespawn4CompatibilityArtifact curseCoordinate('mmd-orespawn',
            project.orespawn4_curse_project_id,
            project.orespawn4_curse_file_id)

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.mockito:mockito-core:2.28.2'
}

// Renamer Gradle replaces ForgeGradle's retired deobfProvided configuration.
// Dependencies are mapped from their production SRG names to stable_39 for the
// development compile/runtime classpaths; the public jar is mapped back below.
renamer.mappings.from minecraft.dependency.toSrgFile

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.mod_version)
    inputs.property('mcversion', project.minecraft_version)

    filesMatching('mcmod.info') {
        expand version: project.mod_version, mcversion: project.minecraft_version
    }
    rename '(.+_at.cfg)', 'META-INF/$1'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    includeEmptyDirs = false
    manifest {
        attributes([
                'Maven-Artifact'        : expectedMavenCoordinate,
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Built-On-Java'         : '8',
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${expectedMavenCoordinate}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching('**/*.html') {
        filter { line -> line.replaceFirst(/^ +(?=[^<].*&nbsp;.*(?:,|\)<\/pre>)$)/, '    ') }
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${expectedMavenCoordinate}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        artifacts.clear()
    }
    artifacts {
        add(configurationName, releaseJar)
    }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def java8Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
    vendor = JvmVendorSpec.ADOPTIUM
}

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ADOPTIUM
}

tasks.register('verifyReleaseToolchains') {
    group = 'verification'
    description = 'Requires the pinned Gradle, Mavenizer, compilation, and runtime JDKs.'
    doLast {
        String gradleVendor = System.getProperty('java.vendor')
        String gradleRuntime = System.getProperty('java.runtime.version')
        if (project.gradle_java_version != '17'
                || gradleVendor != 'Eclipse Adoptium'
                || gradleRuntime != '17.0.1+12') {
            throw new GradleException("Expected Gradle on Temurin 17.0.1+12, found "
                    + "${gradleVendor} ${gradleRuntime} at ${System.getProperty('java.home')}")
        }

        def metadata = java8Launcher.get().metadata
        if (project.java_toolchain_version != '8.0.502+7'
                || metadata.vendor.toString() != 'Eclipse Temurin'
                || metadata.javaRuntimeVersion != '1.8.0_502-b07') {
            throw new GradleException("Expected Temurin ${project.java_toolchain_version}, found "
                    + "${metadata.vendor} ${metadata.javaRuntimeVersion} at ${metadata.installationPath}")
        }

        def mavenizerMetadata = java25Launcher.get().metadata
        if (project.mavenizer_java_version != '25.0.3+9'
                || mavenizerMetadata.vendor.toString() != 'Eclipse Temurin'
                || mavenizerMetadata.javaRuntimeVersion != '25.0.3+9-LTS') {
            throw new GradleException("Expected Mavenizer on Temurin ${project.mavenizer_java_version}, found "
                    + "${mavenizerMetadata.vendor} ${mavenizerMetadata.javaRuntimeVersion} "
                    + "at ${mavenizerMetadata.installationPath}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseToolchains')
}

def expectedReleaseFiles = providers.provider {
    def prefix = "${base.archivesName.get()}-${project.version}"
    [
            "${prefix}.jar",
            "${prefix}-sources.jar",
            "${prefix}-javadoc.jar"
    ]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

def sha256 = { File candidate ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    candidate.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString().toUpperCase()
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates the complete Base Metals 1.12 release identity and dependency contract.'
    dependsOn tasks.named('verifyReleaseToolchains')
    doLast {
        if (project.mod_version != '2.5.1.112021'
                || project.minecraft_version != '1.12.2'
                || project.forge_version != '14.23.5.2859'
                || project.mappings_channel != 'stable'
                || project.mappings_version != '39-1.12') {
            throw new GradleException('Unexpected Base Metals version, Minecraft, Forge, or mappings target')
        }
        String buildScript = file('build.gradle').getText('UTF-8')
        String settingsScript = file('settings.gradle').getText('UTF-8')
        Properties wrapper = new Properties()
        file('gradle/wrapper/gradle-wrapper.properties').withInputStream { wrapper.load(it) }
        if (!buildScript.contains("id 'net.minecraftforge.gradle' version '7.0.34'")
                || !buildScript.contains("id 'net.minecraftforge.renamer' version '1.1.5'")
                || !settingsScript.contains("version '1.0.0'")
                || wrapper.getProperty('distributionUrl')
                        != 'https://services.gradle.org/distributions/gradle-9.6.1-bin.zip'
                || wrapper.getProperty('distributionSha256Sum')
                        != '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14') {
            throw new GradleException('ForgeGradle, Renamer, Foojay, or Gradle wrapper identity drifted')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '8'
                || project.java_toolchain_version != '8.0.502+7'
                || project.gradle_java_version != '17'
                || project.mavenizer_java_version != '25.0.3+9') {
            throw new GradleException('Unexpected loader or Java release metadata')
        }
        if (project.mod_group != expectedMavenGroup
                || base.archivesName.get() != expectedMavenArtifact
                || "${project.group}:${base.archivesName.get()}:${project.version}" != expectedMavenCoordinate) {
            throw new GradleException("Unexpected Maven coordinate; expected ${expectedMavenCoordinate}")
        }
        if (project.cf_project_id != '240967'
                || project.cf_requirements != 'mmd-orespawn,mmdlib'
                || project.cf_versions != '1.12.2') {
            throw new GradleException('Unexpected CurseForge publication contract')
        }
        if (dependencySpecs.mmdlib.version != '1.0.0-rc2.36'
                || dependencySpecs.orespawn3.version != '3.3.1.179') {
            throw new GradleException('Unexpected primary MMDLib or OreSpawn 3 version')
        }
        String source = file('src/main/java/com/mcmoddev/basemetals/BaseMetals.java').getText('UTF-8')
        if (!source.contains('VERSION = "2.5.1.112021"')
                || !source.contains('certificateFingerprint = ""')) {
            throw new GradleException('Base Metals source version or unsigned fingerprint contract drifted')
        }
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves and checksum-verifies all exact legacy mod dependencies.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    doLast {
        def resolved = configurations.legacyDependencyArtifacts.resolvedConfiguration.resolvedArtifacts
        if (resolved.size() != dependencySpecs.size()) {
            throw new GradleException("Expected ${dependencySpecs.size()} exact legacy artifacts, found ${resolved.size()}")
        }
        dependencySpecs.each { name, spec ->
            def bits = spec.coordinate.split(':')
            def matches = resolved.findAll {
                it.moduleVersion.id.group == bits[0]
                        && it.moduleVersion.id.name == bits[1]
                        && it.moduleVersion.id.version == bits[2]
            }
            if (matches.size() != 1) {
                throw new GradleException("Expected exactly ${spec.coordinate}, found ${matches*.moduleVersion*.id}")
            }
            String actual = sha256(matches.first().file)
            if (actual != spec.sha256) {
                throw new GradleException("${name} SHA-256 is ${actual}, expected ${spec.sha256}")
            }
        }
        def orespawn4 = configurations.orespawn4CompatibilityArtifact
                .resolvedConfiguration.resolvedArtifacts
        if (orespawn4.size() != 1
                || sha256(orespawn4.first().file) != project.orespawn4_sha256) {
            throw new GradleException('OreSpawn 4 compatibility artifact is missing or has the wrong SHA-256')
        }
        ZipFile compatibilityJar = new ZipFile(orespawn4.first().file)
        try {
            def entry = compatibilityJar.getEntry('mcmod.info')
            def metadata = entry == null ? null : new JsonSlurper().parseText(
                    compatibilityJar.getInputStream(entry).getText(StandardCharsets.UTF_8.name()))
            def mod = metadata instanceof List ? metadata.find { it.modid == 'orespawn' } : metadata
            if (mod == null || mod.version != project.orespawn4_version) {
                throw new GradleException("OreSpawn 4 compatibility artifact is not ${project.orespawn4_version}")
            }
        } finally {
            compatibilityJar.close()
        }
    }
}

tasks.register('verifyJsonResources') {
    group = 'verification'
    description = 'Parses every production JSON resource.'
    inputs.files(fileTree('src/main/resources') { include '**/*.json' })
    doLast {
        fileTree('src/main/resources') { include '**/*.json' }.files.sort().each { candidate ->
            try {
                new JsonSlurper().parse(candidate)
            } catch (Exception failure) {
                throw new GradleException("Invalid JSON resource ${project.relativePath(candidate)}", failure)
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyJsonResources')
}

tasks.register('verifyHistoricalOreSpawnConfiguration') {
    group = 'verification'
    description = 'Locks the eleven-rule OreSpawn 3 data contract and fallback hand-off behavior.'
    inputs.file('src/main/resources/assets/basemetals/orespawn/basemetals.json')
    inputs.file('src/main/java/com/mcmoddev/basemetals/integration/orespawn/BaseMetalsOreSpawn.java')
    doLast {
        def config = new JsonSlurper().parse(
                file('src/main/resources/assets/basemetals/orespawn/basemetals.json'))
        List<String> expectedRules = [
                'coldiron_ore', 'adamantine_ore', 'starsteel_ore', 'copper_ore',
                'silver_ore', 'tin_ore', 'lead_ore', 'zinc_ore', 'mercury_ore',
                'nickel_ore', 'platinum_ore'
        ].sort()
        if (config.version != '2.0' || config.spawns.keySet().sort() != expectedRules) {
            throw new GradleException('The packaged OreSpawn 3 configuration is not the eleven-rule legacy contract')
        }
        config.spawns.each { name, rule ->
            if (!rule.enabled || rule.retrogen || rule.blocks.size() != 1
                    || rule.blocks.first().name != "basemetals:${name}") {
                throw new GradleException("Historical OreSpawn rule ${name} changed shape")
            }
        }
        String plugin = file('src/main/java/com/mcmoddev/basemetals/integration/orespawn/BaseMetalsOreSpawn.java')
                .getText('UTF-8')
        if (!plugin.contains('@OreSpawnPlugin(modid = BaseMetals.MODID')
                || !plugin.contains('resourcePath = SharedStrings.ORESPAWN_MODID')
                || plugin.contains('package com.mcmoddev.orespawn;')) {
            throw new GradleException('The OreSpawn 3 plugin discovery contract changed')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyHistoricalOreSpawnConfiguration')
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits deterministic jars, legacy inventory, bytecode, metadata, and package isolation.'
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('verifyReleaseDependencies')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Release directory must contain exactly ${expected}; found ${jars*.name}")
        }

        File mainJar = new File(libs, "BaseMetals-${project.version}.jar")
        ZipFile zip = new ZipFile(mainJar)
        try {
            List<String> names = zip.entries().collect { it.name }
            List<String> forbiddenNames = names.findAll { name ->
                name.startsWith('com/mcmoddev/lib/')
                        || name.startsWith('net/minecraft/')
                        || name.startsWith('net/minecraftforge/')
                        || name.startsWith('org/junit/')
                        || name.contains('/test/')
                        || name.toLowerCase().contains('fixture')
                        || name.toLowerCase().contains('agent')
                        || name.toLowerCase().contains('runtimeprobe')
            }
            if (!forbiddenNames.isEmpty()) {
                throw new GradleException("Release jar contains forbidden entries: ${forbiddenNames.take(20)}")
            }

            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 52")
                }
            }

            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry == null ? null
                    : new Manifest(zip.getInputStream(manifestEntry)).mainAttributes
            if (manifest == null
                    || manifest.getValue('Maven-Artifact') != expectedMavenCoordinate
                    || manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Timestamp') != null
                    || manifest.getValue('Built-On') != '1.12.2-14.23.5.2859') {
                throw new GradleException('Release manifest identity is incomplete or volatile')
            }

            def metadataEntry = zip.getEntry('mcmod.info')
            if (metadataEntry == null) {
                throw new GradleException('Release jar is missing mcmod.info')
            }
            def metadata = new JsonSlurper().parseText(
                    zip.getInputStream(metadataEntry).getText(StandardCharsets.UTF_8.name()))
            def mod = metadata instanceof List ? metadata.find { it.modid == 'basemetals' } : metadata
            if (mod == null || mod.version != project.mod_version || mod.mcversion != project.minecraft_version) {
                throw new GradleException('Packaged mcmod.info has the wrong mod or target version')
            }

            List<String> leakedPaths = []
            zip.entries().findAll { entry -> archiveTextSuffixes.any { entry.name.endsWith(it) } }.each { entry ->
                String text = zip.getInputStream(entry).getText(StandardCharsets.UTF_8.name())
                if (text =~ /(?i)([A-Z]:\\Users\\|[A-Z]:\\BaseMetals|\/home\/runner\/|\/Users\/)/) {
                    leakedPaths.add(entry.name)
                }
            }
            if (!leakedPaths.isEmpty()) {
                throw new GradleException("Release jar leaks local paths in ${leakedPaths}")
            }
        } finally {
            zip.close()
        }

        def baselineArtifacts = configurations.legacyBaselineArtifact.resolvedConfiguration.resolvedArtifacts
        if (baselineArtifacts.size() != 1) {
            throw new GradleException("Expected one released Base Metals baseline, found ${baselineArtifacts.size()}")
        }
        File baseline = baselineArtifacts.first().file
        String baselineHash = sha256(baseline)
        if (baselineHash != project.legacy_basemetals_sha256) {
            throw new GradleException("Released baseline SHA-256 is ${baselineHash}, expected "
                    + project.legacy_basemetals_sha256)
        }
        def entryInventory = { File jarFile ->
            ZipFile candidate = new ZipFile(jarFile)
            try {
                candidate.entries().findAll { !it.isDirectory() }.collect { it.name }.sort()
            } finally {
                candidate.close()
            }
        }
        List<String> currentInventory = entryInventory(mainJar)
        List<String> legacyInventory = entryInventory(baseline)
        List<String> allowedAddedEntries = [
                'assets/mmdlib/lang/en_us.lang',
                'assets/mmdlib/lang/es_es.lang',
                // Avoid Java's package-signer collision with signed OreSpawn
                // while preserving the plugin annotation and resource path.
                'com/mcmoddev/basemetals/integration/orespawn/BaseMetalsOreSpawn.class'
        ]
        List<String> allowedRemovedEntries = [
                // The historical CurseForge jar was signed and carried FML's
                // generated cache. Neither belongs in a reproducible rebuild.
                'META-INF/MINECRAF.RSA',
                'META-INF/MINECRAF.SF',
                'META-INF/fml_cache_annotation.json',
                'META-INF/fml_cache_class_versions.json',
                'com/mcmoddev/orespawn/BaseMetalsOreSpawn.class',
                // These source files were deliberately removed on master-1.12
                // after 2.5.0-rc2.332; the modernization does not resurrect them.
                'com/mcmoddev/basemetals/items/MMDToolEffects.class',
                'com/mcmoddev/basemetals/items/package-info.class'
        ]
        List<String> unexpectedAdded = (currentInventory - legacyInventory) - allowedAddedEntries
        List<String> unexpectedRemoved = (legacyInventory - currentInventory) - allowedRemovedEntries
        if (!unexpectedAdded.isEmpty() || !unexpectedRemoved.isEmpty()
                || !allowedAddedEntries.every { currentInventory.contains(it) }
                || !allowedRemovedEntries.every { legacyInventory.contains(it) }) {
            throw new GradleException("Release inventory drifted from ${project.legacy_basemetals_version}; "
                    + "added=${unexpectedAdded.take(20)}, removed=${unexpectedRemoved.take(20)}")
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(providers.provider {
        expectedReleaseFiles.get().collect { name ->
            layout.buildDirectory.file("libs/${name}").get().asFile
        }
    })
    outputs.file(outputFile)
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            "${sha256(new File(libs, name))}  ${name}"
        }.join(System.lineSeparator()) + System.lineSeparator()
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits a previously built immutable release bundle before publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actual = jars.collect { "${sha256(it)}  ${it.name}" }.sort()
        List<String> declared = checksums.readLines('UTF-8').findAll { !it.trim().isEmpty() }.sort()
        if (actual != declared) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

