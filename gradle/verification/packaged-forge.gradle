def packagedForgeRuntimeRoot = providers.gradleProperty('packagedForgeRuntimeRoot')
def validatePackagedForgeRoot = {
    if (!packagedForgeRuntimeRoot.isPresent()) {
        throw new GradleException('packagedForgeRuntimeRoot is required for packaged Forge qualification')
    }
    File root = file(packagedForgeRuntimeRoot.get())
    [
            new File(root, "forge-${project.minecraft_version}-${project.forge_version}-universal.jar"),
            new File(root, "minecraft_server.${project.minecraft_version}.jar"),
            new File(root, 'libraries')
    ].each { required ->
        if (!required.exists()) {
            throw new GradleException("Packaged Forge runtime is missing ${required}")
        }
    }
    root
}

def originalArtifact = { Configuration configuration, String coordinate ->
    String[] bits = coordinate.split(':')
    def matches = configuration.resolvedConfiguration.resolvedArtifacts.findAll {
        it.moduleVersion.id.group == bits[0]
                && it.moduleVersion.id.name == bits[1]
                && it.moduleVersion.id.version == bits[2]
    }
    if (matches.size() != 1) {
        throw new GradleException("Expected exactly ${coordinate}, found ${matches*.moduleVersion*.id}")
    }
    matches.first().file
}

def runtimeLogFailures = { File runDirectory ->
    List<String> fatalMarkers = [
            'Encountered an unexpected exception', 'LoaderException', 'NoClassDefFoundError',
            'NoSuchMethodError', 'NoSuchFieldError', 'IllegalAccessError', 'LinkageError',
            'Parsing error loading recipe',
            'Exception stopping the server', 'The following mod(s) have been identified as potential causes'
    ]
    List<String> failures = []
    fileTree(runDirectory) {
        include 'logs/**/*.log'
        include '*-console.txt'
    }.files.each { log ->
        int lineNumber = 0
        log.eachLine('UTF-8') { line ->
            lineNumber++
            if (fatalMarkers.any { line.contains(it) }) {
                failures.add("${log.name}:${lineNumber}: ${line}")
            }
        }
    }
    failures
}

def packagedStacks = [
        Os4: [
                display: 'OreSpawn 4',
                modVersion: project.orespawn4_version,
                expectedAncientWarfare: false,
                extraMods: [],
                coordinate: dependencySpecs.orespawn4.coordinate
        ],
        Os4NoPlateRepair: [
                display: 'OreSpawn 4 with plate repairs disabled',
                modVersion: project.orespawn4_version,
                expectedAncientWarfare: false,
                disablePlateRepairs: true,
                extraMods: [],
                coordinate: dependencySpecs.orespawn4.coordinate
        ],
        AncientWarfare: [
                display: 'OreSpawn 4 plus Ancient Warfare 2',
                modVersion: project.orespawn4_version,
                expectedAncientWarfare: true,
                extraMods: [dependencySpecs.ancientwarfare, dependencySpecs.codechickenlib],
                coordinate: dependencySpecs.orespawn4.coordinate
        ]
]

packagedStacks.each { stackName, stack ->
    File runDirectory = file("${buildDir}/packaged-forge-${stackName.toLowerCase()}-run")
    File marker = new File(runDirectory, 'basemetals-runtime-probe.properties')
    def prepareTask = tasks.register("preparePackagedForge${stackName}Runtime") {
        group = 'verification'
        dependsOn releaseJar
        dependsOn packagedRuntimeProbeJar
        dependsOn tasks.named('verifyReleaseDependencies')
        doLast {
            delete runDirectory
            File sourceRuntime = validatePackagedForgeRoot()
            File forge = new File(sourceRuntime,
                    "forge-${project.minecraft_version}-${project.forge_version}-universal.jar")
            java.util.jar.JarFile forgeJar = new java.util.jar.JarFile(forge)
            String declaredClasspath
            try {
                declaredClasspath = forgeJar.manifest.mainAttributes.getValue('Class-Path')
            } finally {
                forgeJar.close()
            }
            if (declaredClasspath == null || declaredClasspath.trim().isEmpty()) {
                throw new GradleException("Forge runtime has no Class-Path manifest entry: ${forge}")
            }
            copy { from forge; into runDirectory }
            copy {
                from new File(sourceRuntime, "minecraft_server.${project.minecraft_version}.jar")
                into runDirectory
            }
            declaredClasspath.trim().split(/\s+/).findAll {
                it != "minecraft_server.${project.minecraft_version}.jar"
            }.each { String entry ->
                String relative = entry.startsWith('libraries/')
                        ? entry.substring('libraries/'.length()) : entry
                File dependency = new File(sourceRuntime, "libraries/${relative}")
                if (!dependency.isFile()) {
                    throw new GradleException("Forge runtime dependency is missing: ${dependency}")
                }
                copy { from dependency; into new File(runDirectory, "libraries/${relative}").parentFile }
            }
            File mods = new File(runDirectory, 'mods')
            mods.mkdirs()
            copy { from layout.buildDirectory.file("libs/BaseMetals-${project.version}.jar"); into mods }
            copy { from layout.buildDirectory.file('runtime-probes/basemetals-runtime-probe.jar'); into mods }
            copy {
                from originalArtifact(configurations.legacyDependencyArtifacts,
                        dependencySpecs.mmdlib.coordinate)
                into mods
            }
            copy {
                from originalArtifact(configurations.legacyDependencyArtifacts, stack.coordinate)
                into mods
            }
            stack.extraMods.each { spec ->
                copy {
                    from originalArtifact(configurations.legacyDependencyArtifacts, spec.coordinate)
                    into mods
                }
            }
            new File(runDirectory, 'server.properties').setText('''\
level-name=world
level-seed=basemetals-release-modernization
level-type=default
online-mode=false
server-port=0
allow-nether=false
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            if (stack.disablePlateRepairs) {
                File configDirectory = new File(runDirectory, 'config')
                configDirectory.mkdirs()
                new File(configDirectory, 'MMDLib.cfg').setText(
                        'general {\n    B:repair_using_plates=false\n}\n', 'UTF-8')
            }
        }
    }

    def previous = prepareTask
    ['Fresh', 'Reload'].each { phase ->
        def dependencyTask = previous
        def processTask = tasks.register("packagedForge${stackName}${phase}Process", Exec) {
            group = 'verification'
            dependsOn dependencyTask
            workingDir runDirectory
            ByteArrayOutputStream console = new ByteArrayOutputStream()
            doFirst {
                console.reset()
                marker.delete()
                File javaExecutable = java8Launcher.get().executablePath.asFile
                File forge = new File(runDirectory,
                        "forge-${project.minecraft_version}-${project.forge_version}-universal.jar")
                commandLine javaExecutable,
                        '-Dforge.logging.console.level=info',
                        "-Dbasemetals.probe.phase=${phase.toLowerCase()}",
                        "-Dbasemetals.probe.expectedOrespawn=${stack.modVersion}",
                        "-Dbasemetals.probe.expectedAncientWarfare=${stack.expectedAncientWarfare}",
                        "-Dbasemetals.probe.expectPlateRepairs=${!stack.disablePlateRepairs}",
                        "-Dbasemetals.probe.marker=${marker.absolutePath}",
                        '-jar', forge, 'nogui'
                standardOutput = console
                errorOutput = console
            }
            doLast {
                new File(runDirectory,
                        "${stackName.toLowerCase()}-${phase.toLowerCase()}-console.txt")
                        .setText(console.toString('UTF-8'), 'UTF-8')
                if (!marker.isFile()) {
                    throw new GradleException("${stack.display} ${phase} probe marker is missing")
                }
                Properties result = new Properties()
                marker.withInputStream { result.load(it) }
                if (result.getProperty('phase') != phase.toLowerCase()
                        || result.getProperty('registered') != 'true'
                        || result.getProperty('orespawn') != stack.modVersion
                        || result.getProperty('ancientWarfare')
                                != stack.expectedAncientWarfare.toString()) {
                    throw new GradleException("${stack.display} ${phase} probe result is invalid: ${result}")
                }
                File worldProfile = new File(runDirectory,
                        'world/serverconfig/orespawn-worldgen.json')
                if (!worldProfile.isFile()) {
                    throw new GradleException("${stack.display} did not snapshot the world profile")
                }
                def profile = new JsonSlurper().parse(worldProfile)
                def generatedRules = profile.ores.findAll { id, rule ->
                    id.startsWith('basemetals:legacy/')
                }
                if (generatedRules.size() != 11
                        || !generatedRules.every { id, rule ->
                            rule.enabled && rule.source_provider == 'basemetals'
                        }) {
                    throw new GradleException("${stack.display} did not snapshot eleven enabled native rules")
                }
                String latestLog = new File(runDirectory, 'logs/latest.log').getText('UTF-8')
                if (latestLog.contains('Fallback Ore Spawn Generator Enabled!')
                        || latestLog.contains('Loading Integration For basemetals')
                        || !latestLog.contains("worldgen provider 'basemetals' revision 2 is active")) {
                    throw new GradleException("${stack.display} did not take exclusive ownership of Base Metals ore generation")
                }
                List<String> failures = runtimeLogFailures(runDirectory)
                if (!failures.isEmpty()) {
                    throw new GradleException("${stack.display} ${phase} logged runtime failures:\n"
                            + failures.take(20).join('\n'))
                }
            }
        }
        previous = processTask
    }
    tasks.register("packagedForge${stackName}RuntimeTest") {
        group = 'verification'
        description = "Creates and reloads a packaged Forge world with ${stack.display}."
        dependsOn previous
    }
}

