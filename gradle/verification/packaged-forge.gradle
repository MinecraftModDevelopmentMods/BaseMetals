def packagedForgeServerRuntime = providers.gradleProperty('packagedForgeServerRuntime')
def packagedForgeClientRuntime = providers.gradleProperty('packagedForgeClientRuntime')
def requireRuntimeDirectory = { Provider<String> configuredPath, String propertyName ->
    if (!configuredPath.isPresent()) {
        throw new GradleException("Pass -P${propertyName}=<official Forge 28 runtime directory>")
    }
    File runtime = file(configuredPath.get()).canonicalFile
    if (!runtime.isDirectory()) {
        throw new GradleException("${propertyName} does not name a directory: ${runtime}")
    }
    runtime
}
def prepareBuildOwnedRunDirectory = { File candidate, String expectedName ->
    File runDirectory = candidate.canonicalFile
    File buildDirectory = layout.buildDirectory.get().asFile.canonicalFile
    if (!runDirectory.toPath().startsWith(buildDirectory.toPath()) || runDirectory.name != expectedName) {
        throw new GradleException("Unsafe packaged-runtime directory: ${runDirectory}")
    }
    delete runDirectory
    if (!runDirectory.mkdirs()) throw new GradleException("Could not create ${runDirectory}")
    runDirectory
}
def releasedOreSpawnJar = {
    File artifact = configurations.orespawnRelease.singleFile
    if (artifact == null || !artifact.isFile() || sha256(artifact) != configuredOreSpawnIdentity.sha256) {
        throw new GradleException('Exact released OreSpawn artifact is unavailable for packaged testing')
    }
    artifact
}
def assertPackagedRuntimePassed = { File runDirectory, String marker, String label ->
    File log = new File(runDirectory, 'logs/latest.log')
    if (!log.isFile()) throw new GradleException("${label} log is missing: ${log}")
    String contents = log.getText('UTF-8')
    if (!contents.contains(marker)) throw new GradleException("${label} did not report ${marker}")
    List<String> failures = ['Failed to load correctly', 'This crash report has been saved to',
                             'Encountered an unexpected exception', 'BASEMETALS_RUNTIME_PROBE FAIL',
                             'BASEMETALS_CLIENT_PROBE FAIL']
            .findAll { contents.contains(it) }
    if (!failures.isEmpty()) throw new GradleException("${label} failures: ${failures}")
    File crashReports = new File(runDirectory, 'crash-reports')
    if (crashReports.isDirectory() && !fileTree(crashReports).files.isEmpty()) {
        throw new GradleException("${label} created crash reports in ${crashReports}")
    }
}

def packagedServerRunDirectory = layout.buildDirectory.dir('packaged-server-run')
def preparePackagedServerIntegration = tasks.register('preparePackagedServerIntegration') {
    dependsOn releaseJar
    dependsOn packagedServerProbeJar
    dependsOn tasks.named('verifyReleaseDependencies')
    doLast {
        File runDirectory = prepareBuildOwnedRunDirectory(
                packagedServerRunDirectory.get().asFile, 'packaged-server-run')
        copy {
            from releaseJar
            from packagedServerProbeJar
            from releasedOreSpawnJar()
            into new File(runDirectory, 'mods')
        }
        new File(runDirectory, 'server.properties').setText('''\
level-name=basemetals-packaged-server-smoke
online-mode=false
spawn-protection=0
server-port=0
view-distance=4
max-tick-time=-1
''', 'UTF-8')
        new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}
def packagedServerProcess = tasks.register('packagedServerProcess', Exec) {
    group = 'verification'
    timeout = java.time.Duration.ofMinutes(5)
    dependsOn preparePackagedServerIntegration
    doFirst {
        File runtime = requireRuntimeDirectory(packagedForgeServerRuntime, 'packagedForgeServerRuntime')
        File launcher = new File(runtime, "forge-${minecraft_version}-${forge_version}.jar")
        File vanillaServer = new File(runtime, "minecraft_server.${minecraft_version}.jar")
        File libraries = new File(runtime, 'libraries')
        [launcher, vanillaServer, libraries].each {
            if (!it.exists()) throw new GradleException("Incomplete official server runtime: ${it}")
        }
        workingDir packagedServerRunDirectory.get().asFile
        commandLine javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(8)
            vendor = JvmVendorSpec.ADOPTIUM
        }.get().executablePath.asFile.absolutePath,
                '-Xms512m', '-Xmx2g', '-Dbasemetalsprobe.sampleOres=true', '-jar', launcher.absolutePath, 'nogui'
    }
}
tasks.register('packagedServerIntegrationTest') {
    group = 'verification'
    description = 'Runs the exact release jars in an official Forge 28 dedicated-server runtime.'
    dependsOn packagedServerProcess
    doLast {
        assertPackagedRuntimePassed(packagedServerRunDirectory.get().asFile,
                'BASEMETALS_RUNTIME_PROBE PASS', 'packaged dedicated server')
    }
}

def packagedServerReloadProcess = tasks.register('packagedServerReloadProcess', Exec) {
