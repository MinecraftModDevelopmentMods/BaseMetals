    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn generateOreOverlayClientFixtures
    doLast {
        File runDirectory = prepareBuildOwnedRunDirectory(
                packagedClientRunDirectory.get().asFile, 'packaged-client-run')
        copy {
            from releaseJar
            from packagedClientProbeJar
            from releasedOreSpawnJar()
            into new File(runDirectory, 'mods')
        }
        File overlayPack = new File(runDirectory, 'resourcepacks/basemetals-ore-overlay-fixture')
        copy { from oreOverlayClientFixtures; into overlayPack }
        new File(overlayPack, 'pack.mcmeta').setText(
                '{"pack":{"pack_format":4,"description":"Base Metals ore overlay test fixture"}}\n', 'UTF-8')
        new File(runDirectory, 'options.txt').setText(
                'fullscreen:false\nlang:en_us\nresourcePacks:["file/basemetals-ore-overlay-fixture"]\n', 'UTF-8')
    }
}
def packagedClientProcess = tasks.register('packagedClientProcess', Exec) {
    group = 'verification'
    timeout = java.time.Duration.ofMinutes(3)
    dependsOn preparePackagedClientIntegration
    doFirst {
        File runtime = requireRuntimeDirectory(packagedForgeClientRuntime, 'packagedForgeClientRuntime')
        File forgeJsonFile = new File(runtime,
                "versions/${minecraft_version}-forge-${forge_version}/${minecraft_version}-forge-${forge_version}.json")
        File baseJsonFile = new File(runtime, "versions/${minecraft_version}/${minecraft_version}.json")
        File baseJar = new File(runtime, "versions/${minecraft_version}/${minecraft_version}.jar")
        File libraries = new File(runtime, 'libraries')
        File assets = new File(runtime, 'assets-local')
        if (!assets.isDirectory()) assets = new File(runtime, 'assets')
        File natives = new File(runtime, 'natives')
        File versionNatives = new File(natives, "forge-${forge_version}")
        if (versionNatives.isDirectory()) natives = versionNatives
        [forgeJsonFile, baseJsonFile, baseJar, libraries, assets, natives].each {
            if (!it.exists()) throw new GradleException("Incomplete official client runtime: ${it}")
        }

        Map forgeJson = (Map) new JsonSlurper().parse(forgeJsonFile)
        Map baseJson = (Map) new JsonSlurper().parse(baseJsonFile)
        Map<String, File> classpathByModule = new LinkedHashMap<>()
        [baseJson, forgeJson].each { Map metadata ->
            ((List) metadata.libraries).each { Map library ->
                List<Map> rules = (List<Map>) library.rules
                boolean allowed = rules == null || rules.isEmpty()
                if (rules != null) {
                    rules.each { Map rule ->
                        Map os = (Map) rule.os
                        boolean matches = os == null || (os.name == 'windows'
                                && (os.arch == null || os.arch == System.getProperty('os.arch')))
                        if (matches) allowed = rule.action == 'allow'
                    }
                }
                if (!allowed) return
                String relative = (String) ((Map) ((Map) library.downloads).artifact).path
                File artifact = new File(runtime, "libraries/${relative}")
                if (!artifact.isFile()) throw new GradleException("Missing official client library: ${artifact}")
                List<String> coordinates = ((String) library.name).split(':') as List<String>
                String module = coordinates.size() >= 2
                        ? "${coordinates[0]}:${coordinates[1]}" : (String) library.name
                classpathByModule.put(module, artifact)
            }
        }
        List<File> classpathFiles = new ArrayList<>(classpathByModule.values())
        classpathFiles.add(baseJar)
        List<String> gameArguments = []
        gameArguments.addAll((List<String>) ((Map) forgeJson.arguments).game)
        gameArguments.addAll([
                '--username', 'BaseMetalsValidation',
                '--version', "${minecraft_version}-forge-${forge_version}",
                '--gameDir', packagedClientRunDirectory.get().asFile.absolutePath,
                '--assetsDir', assets.absolutePath,
                '--assetIndex', baseJson.assetIndex.id,
                '--uuid', '00000000-0000-0000-0000-000000000001',
                '--accessToken', 'validation-token',
                '--userType', 'legacy',
                '--versionType', 'release',
                '--width', '854', '--height', '480'
        ])
        workingDir packagedClientRunDirectory.get().asFile
        commandLine javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(8)
            vendor = JvmVendorSpec.ADOPTIUM
        }.get().executablePath.asFile.absolutePath,
                '-Xms512m', '-Xmx2g', '-Dbasemetalsclientprobe.enabled=true',
                "-Djava.library.path=${natives.absolutePath}",
                '-Dminecraft.launcher.brand=basemetals-validation',
                '-Dminecraft.launcher.version=1',
                '-cp', classpathFiles.collect { it.absolutePath }.join(File.pathSeparator),
                (String) forgeJson.mainClass
        args gameArguments
    }
}
tasks.register('packagedClientIntegrationTest') {
    group = 'verification'
    description = 'Loads and renders the exact release jars in an official Forge 28 client runtime.'
    dependsOn packagedClientProcess
    doLast {
        File runDirectory = packagedClientRunDirectory.get().asFile
        File marker = new File(runDirectory, 'client-smoke-pass.properties')
        if (!marker.isFile()) throw new GradleException('Packaged client completion marker is missing')
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        if (values.getProperty('content_verified') != 'true'
                || values.getProperty('integrated_world_rendered') != 'true') {
            throw new GradleException("Packaged client probe failed: ${values}")
        }
        assertPackagedRuntimePassed(runDirectory, 'BASEMETALS_CLIENT_PROBE PASS', 'packaged client')
    }
}

