// Shared validation gates that do not require an installed packaged runtime.
tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def prepareCustomDimensionSmoke = tasks.register('prepareCustomDimensionSmoke', Sync) {
    group = 'verification'
    description = 'Installs the runtime-only custom-dimension datapack into the disposable smoke world.'
    from layout.projectDirectory.dir('src/smoke/datapack')
    into layout.projectDirectory.dir('run/smoke-custom-dimension/datapacks/basemetals-smoke')
}

tasks.matching { it.name == 'runServer' }.configureEach {
    if (providers.gradleProperty('smokeCustomDimension').isPresent()) {
        dependsOn prepareCustomDimensionSmoke
    }
}

def upgradeWorldSmokeRequested = providers.gradleProperty('upgradeWorldSmoke').isPresent()
def legacyWorldSmokeRequested = providers.gradleProperty('legacyWorldSmoke').isPresent()
def configuredUpgradeWorldName = upgradeWorldSmokeRequested
        ? providers.gradleProperty('upgradeWorldName').orNull
        : providers.gradleProperty('legacyWorldName').orNull
def upgradeSmokeResultFile = configuredUpgradeWorldName == null
        ? null
        : layout.projectDirectory.file("run-upgrade/${configuredUpgradeWorldName}/BASEMETALS_UPGRADE_SMOKE_RESULT.txt")

def verifyUpgradeWorldSmokeResult = tasks.register('verifyUpgradeWorldSmokeResult') {
    group = 'verification'
    description = 'Fails unless the selected upgraded-world smoke writes its expected success marker.'
    onlyIf { upgradeWorldSmokeRequested || legacyWorldSmokeRequested }
    doLast {
        if (configuredUpgradeWorldName == null || configuredUpgradeWorldName.isBlank()) {
            throw new GradleException('An upgraded-world smoke requires -PupgradeWorldName or -PlegacyWorldName')
        }
        if (configuredUpgradeWorldName.contains('/') || configuredUpgradeWorldName.contains('\\')
                || configuredUpgradeWorldName == '.' || configuredUpgradeWorldName == '..') {
            throw new GradleException("Invalid upgraded-world smoke name: ${configuredUpgradeWorldName}")
        }
        File result = upgradeSmokeResultFile.asFile
        if (!result.isFile()) {
            throw new GradleException("Upgraded-world smoke did not write ${result}")
        }
        String expected = upgradeWorldSmokeRequested
                ? 'BASEMETALS_UPGRADE_SMOKE PASS'
                : 'BASEMETALS_LEGACY_WORLD_SMOKE PASS'
        String actual = result.getText('UTF-8').trim()
        if (!actual.startsWith(expected)) {
            throw new GradleException("Upgraded-world smoke failed: ${actual}")
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    if (upgradeWorldSmokeRequested || legacyWorldSmokeRequested) {
        finalizedBy verifyUpgradeWorldSmokeResult
        doFirst {
            if (configuredUpgradeWorldName == null || configuredUpgradeWorldName.isBlank()) {
                throw new GradleException('An upgraded-world smoke requires -PupgradeWorldName or -PlegacyWorldName')
            }
            if (configuredUpgradeWorldName.contains('/') || configuredUpgradeWorldName.contains('\\')
                    || configuredUpgradeWorldName == '.' || configuredUpgradeWorldName == '..') {
                throw new GradleException("Invalid upgraded-world smoke name: ${configuredUpgradeWorldName}")
            }
            delete upgradeSmokeResultFile
        }
    }
}

// Native datagen uses a disposable output tree; check never rewrites source files.
def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')
def generatedVerificationDir = layout.buildDirectory.dir('generated-verification')

def generatedFingerprint = { File directory ->
    fileTree(directory).matching { exclude '.cache/**' }.files
            .findAll { it.isFile() }.sort { a, b -> a.absolutePath <=> b.absolutePath }
            .collectEntries { File resource ->
                String relative = directory.toPath().relativize(resource.toPath()).toString().replace('\\', '/')
                byte[] digest = java.security.MessageDigest.getInstance('SHA-256').digest(resource.bytes)
                [(relative): digest.encodeHex().toString()]
            }
}

tasks.register('generateResources', Sync) {
    group = 'build'
    description = 'Updates the checked-in recipes, models, translations and tags.'
    dependsOn 'runData'
    from generatedVerificationDir
    exclude '.cache/**'
    into generatedResourcesDir
}

// Honour an explicit resource refresh without making ordinary builds rewrite it.
tasks.named('sourcesJar').configure {
    mustRunAfter tasks.named('generateResources')
}

def verifyGeneratedData = tasks.register('verifyGeneratedData') {
    group = 'verification'
    description = 'Compares native datagen output with checked-in resources without modifying them.'
    dependsOn 'runData'
    doLast {
        Map committed = generatedFingerprint(generatedResourcesDir.asFile)
        Map generated = generatedFingerprint(generatedVerificationDir.get().asFile)
        if (committed != generated) {
            Set<String> changed = new TreeSet<>(committed.keySet() + generated.keySet())
            changed.removeIf { committed[it] == generated[it] }
            throw new GradleException("Generated resources are stale. Run generateResources: ${changed.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyGeneratedData
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyReleaseConfiguration')
}

def gameTestResources = layout.buildDirectory.dir('gametest-resources')

def prepareGameTestStructures = tasks.register('prepareGameTestStructures') {
    group = 'verification'
    description = 'Creates the empty structure used by the isolated GameTests.'
    outputs.dir gameTestResources
    inputs.files(fileTree('src/gametest/java') { include '**/*.java' })
    doLast {
        File structure = new File(gameTestResources.get().asFile, 'data/basemetals/structure/empty.nbt')
        structure.parentFile.mkdirs()
        structure.withOutputStream { fileStream ->
            new DataOutputStream(new java.util.zip.GZIPOutputStream(fileStream)).withCloseable { nbt ->
                nbt.writeByte(10); nbt.writeUTF('')
                nbt.writeByte(3); nbt.writeUTF('DataVersion'); nbt.writeInt(3955)
                nbt.writeByte(9); nbt.writeUTF('size'); nbt.writeByte(3); nbt.writeInt(3)
                [3, 3, 3].each { nbt.writeInt(it) }
                nbt.writeByte(9); nbt.writeUTF('palette'); nbt.writeByte(10); nbt.writeInt(1)
                nbt.writeByte(8); nbt.writeUTF('Name'); nbt.writeUTF('minecraft:air'); nbt.writeByte(0)
                ['blocks', 'entities'].each { name ->
                    nbt.writeByte(9); nbt.writeUTF(name); nbt.writeByte(10); nbt.writeInt(0)
                }
                nbt.writeByte(0)
            }
        }

        File instances = new File(gameTestResources.get().asFile, 'data/basemetals/test_instance')
        delete instances
        instances.mkdirs()
        int count = 0

        fileTree('src/gametest/java').matching { include '**/*.java' }.files.sort().each { source ->
            def methods = source.getText('UTF-8') =~ /(?s)@GameTest\((.*?)\)\s+public static void (\w+)\(/

            methods.each { match ->
                String annotation = match[1]
                String name = match[2].replaceAll(/([A-Z])/, '_$1').toLowerCase(Locale.ROOT)
                def maxTicks = annotation =~ /maxTicks\s*=\s*(\d+)/
                def setupTicks = annotation =~ /setupTicks\s*=\s*(\d+)/
                Map data = [type: 'minecraft:function', function: "basemetals:${name}",
                            environment: 'minecraft:default', structure: 'basemetals:empty',
                            max_ticks: maxTicks.find() ? maxTicks.group(1).toInteger() : 100,
                            setup_ticks: setupTicks.find() ? setupTicks.group(1).toInteger() : 0]

                new File(instances, "${name}.json").setText(
                        groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
                count++
            }
        }

        if (count != 46) {
            throw new GradleException("Expected 46 native GameTest instances, found ${count}")
        }
    }
}

sourceSets.gameTestValidation.resources.srcDir gameTestResources
tasks.named('processGameTestValidationResources').configure { dependsOn prepareGameTestStructures }

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures
    args '--tests', 'basemetals:*'
    doFirst {
        File runDirectory = layout.projectDirectory.dir('run-gametest').asFile
        runDirectory.mkdirs()

        new File(runDirectory, 'server.properties').setText('online-mode=false\nmax-tick-time=-1\n', 'UTF-8')
        File previousLog = new File(runDirectory, 'logs/latest.log')
        if (previousLog.isFile()) {
            File evidence = layout.buildDirectory.file("gametest-history/${System.currentTimeMillis()}.log").get().asFile
            evidence.parentFile.mkdirs()
            evidence.bytes = previousLog.bytes
            previousLog.delete()
        }
    }
    doLast {
        File log = layout.projectDirectory.file('run-gametest/logs/latest.log').asFile
        String text = log.isFile() ? log.getText('UTF-8') : ''
        if (!(text =~ /All 46 required tests passed/).find()) {
            throw new GradleException('GameTests did not report a completed, passing suite. See run-gametest/logs/latest.log.')
        }
        if (text =~ /(?i)(ERROR|FATAL)\]/) {
            throw new GradleException('GameTests logged an error. See run-gametest/logs/latest.log.')
        }
    }
}
