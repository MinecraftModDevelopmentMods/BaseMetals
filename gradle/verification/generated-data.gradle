import groovy.json.JsonSlurper

def generateCatalogueResources = tasks.register('generateCatalogueResources', Exec) {
    group = 'data generation'
    description = 'Updates recipes, loot, tags and translations for Minecraft 1.17.1.'
    commandLine 'node', 'tools/generate_117_resources.js'
}

tasks.matching { it.name == 'runData' }.configureEach { mustRunAfter generateCatalogueResources }
tasks.named('processResources') { mustRunAfter generateCatalogueResources }

def generateResources = tasks.register('generateResources') {
    group = 'data generation'
    description = 'Updates the saved resources, including Kiri\'s native Forge ore models.'
    dependsOn generateCatalogueResources, 'runData'
    doLast {
        File models = layout.buildDirectory.dir('native-generated-resources').get().asFile
        if (fileTree(models) { include 'assets/basemetals/models/block/*_ore.json' }.files.size() != 13) {
            throw new GradleException('Forge did not run the Base Metals model provider')
        }
        copy {
            from layout.buildDirectory.dir('native-generated-resources')
            into 'src/generated/resources'
            exclude '.cache/**'
        }
    }
}

tasks.register('generateOreModels') {
    group = 'data generation'
    description = 'Alias for the native resource generator.'
    dependsOn generateResources
}

def verifyGeneratedData = tasks.register('verifyGeneratedData', Exec) {
    group = 'verification'
    description = 'Checks generated catalogue resources without rewriting them.'
    commandLine 'node', 'tools/generate_117_resources.js', '--verify'
}

tasks.register('verifyGeneratedOreModels') {
    group = 'verification'
    description = 'Runs native datagen into build output and checks the committed models and mining tags.'
    dependsOn 'runData'
    doLast {
        File generated = layout.buildDirectory.dir('native-generated-resources').get().asFile
        fileTree(generated) { exclude '.cache/**' }.files.findAll { it.isFile() }.each { model ->
            String relative = generated.toPath().relativize(model.toPath()).toString()
            File committed = file("src/generated/resources/${relative}")
            if (!committed.isFile() || new JsonSlurper().parse(model) != new JsonSlurper().parse(committed)) {
                throw new GradleException("Native generated resource is stale: ${relative}. Run generateResources.")
            }
        }
        if (fileTree(generated) { include 'assets/basemetals/models/block/*_ore.json' }.files.size() != 13) {
            throw new GradleException('Native datagen must generate all thirteen ore models')
        }
    }
}

tasks.named('verifyReleaseArtifacts') { dependsOn tasks.named('verifyGeneratedOreModels') }
tasks.named('check') {
    dependsOn tasks.named('verifyDevelopmentLaunches'), verifyGeneratedData
    dependsOn tasks.named('verifyReleaseConfiguration'), tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyMavenCoordinates')
}

project.ext.baseMetalsBuild.generateOreModels = tasks.named('generateOreModels')
