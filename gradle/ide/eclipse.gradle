def escapeXml = { String text ->
    text.replace('&', '&amp;').replace('"', '&quot;').replace('<', '&lt;').replace('>', '&gt;')
}

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.beforeMerged { classpath ->
            Set<String> managed = ['src/main/java', 'src/main/resources', 'src/test/java',
                    'build/resources/main', 'tools/validation/legacy110',
                    'tools/validation/legacy110/migration-probe',
                    'tools/validation/legacy110/launch-probe',
                    'tools/validation/legacy110/orespawn-probe'] as Set<String>
            classpath.entries.removeAll { it.kind == 'src' && managed.contains(it.path) }
        }
        file.whenMerged { classpath ->
            // Eclipse must copy the expanded metadata, not the source placeholders.
            classpath.entries.findAll { it.kind == 'src' && it.path == 'src/main/resources' }.each {
                it.path = 'build/resources/main'
            }
            classpath.entries.findAll { it.kind == 'src' && !it.path.startsWith('src/main/') }.each {
                if (it.path != 'build/resources/main') it.entryAttributes['test'] = 'true'
            }
        }
        file.withXml { provider ->
            Node root = provider.asNode()
            root.classpathentry.findAll { it.@kind == 'lib' }.each { root.remove(it) }
            if (!root.classpathentry.any { it.@path == 'org.eclipse.buildship.core.gradleclasspathcontainer' }) {
                root.appendNode('classpathentry', [kind: 'con', path: 'org.eclipse.buildship.core.gradleclasspathcontainer'])
            }
        }
    }
    synchronizationTasks 'genEclipseRuns'
}
idea.module { downloadSources = true; downloadJavadoc = true }

def configureBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File target = file('.settings/org.eclipse.buildship.core.prefs')
        Properties values = new Properties()
        if (target.isFile()) target.withInputStream { values.load(it) }
        [
                'eclipse.preferences.version': '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'connection.java.home': System.getProperty('java.home'),
                'java.home': System.getProperty('java.home'),
                'connection.project.dir': '', 'override.workspace.settings': 'true'
        ].each { key, value -> values.setProperty(key, value) }
        target.parentFile.mkdirs()
        target.withOutputStream { values.store(it, 'Generated by configureEclipseBuildship.') }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Quotes launcher paths and keeps optional API jars and tests out of ordinary launches.'
    dependsOn configureBuildship, tasks.named('processResources'), tasks.named('prepareJava8Launcher')
    doLast {
        // Copy, rather than Sync: Eclipse owns and compiles the classes in bin/main.
        copy { from layout.buildDirectory.dir('resources/main'); into file('bin/main') }
        file('run').mkdirs()
        List<File> runtime = configurations.runtimeClasspath.files.collect { it.canonicalFile }
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("Missing generated launch: ${name}")
            String text = launch.getText('UTF-8').replace('\r\n', '\n')
            text = text.replace(escapeXml(configurations.java8LauncherArtifact.singleFile.canonicalPath),
                    escapeXml(tasks.named('prepareJava8Launcher', Jar).get().archiveFile.get().asFile.canonicalPath))
            def arguments = text =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (arguments.count != 1) throw new GradleException("Malformed launcher arguments: ${name}")
            String args = arguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                int start = args.indexOf("--${flag} ")
                if (start < 0) throw new GradleException("Missing --${flag} in ${name}")
                start += flag.length() + 3
                int end = args.indexOf(' --', start)
                if (end < 0) throw new GradleException("Unterminated --${flag} in ${name}")
                String value = args.substring(start, end)
                if (!value.startsWith('&quot;')) args = args.substring(0, start) + '&quot;' + value + '&quot;' + args.substring(end)
            }
            text = text.replace(arguments[0][0], arguments[0][1] + args + arguments[0][3])
            text = text.replaceAll(/<mapEntry key="MC_VERSION" value="[^"]*"\/>/,
                    '<mapEntry key="MC_VERSION" value="1.10.2"/>')
            String modClasses = '<mapEntry key="MOD_CLASSES" value="' + escapeXml(file('bin/main').absolutePath) + '"/>'
            if (text.contains('key="MOD_CLASSES"')) {
                text = text.replaceAll(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                        java.util.regex.Matcher.quoteReplacement(modClasses))
            } else {
                text = text.replace('</mapAttribute>', '    ' + modClasses + '\n  </mapAttribute>')
            }
            List<String> lines = text.split('\n', -1) as List<String>
            def entries = (0..<lines.size()).findAll { lines[it].contains('org.eclipse.buildship.core.gradleclasspathcontainer') }
            if (entries.size() != 1) throw new GradleException("Expected one Buildship entry in ${name}")
            lines[entries[0]] = runtime.collect { archive ->
                String memento = '<runtimeClasspathEntry externalArchive="' + escapeXml(archive.path) + '" type="2" path="5" />'
                '    <listEntry value="' + escapeXml(memento) + '"/>'
            }.join('\n')
            text = lines.join('\n')
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\n</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}
tasks.named('genEclipseRuns') { finalizedBy tasks.named('isolateEclipseProductionRuns') }
tasks.named('eclipse') { dependsOn tasks.named('genEclipseRuns') }

def verifyJavaSourceLayout = tasks.register('verifyJavaSourceLayout') {
    group = 'verification'
    description = 'Checks that Java package names match their source folders, as Eclipse requires.'
    inputs.files(provider { sourceSets.collect { it.java } })
    doLast {
        List<String> mismatches = []
        sourceSets.each { sourceSet ->
            sourceSet.java.visit { entry ->
                if (entry.directory || !entry.name.endsWith('.java')) return

                String path = entry.relativePath.pathString
                int separator = path.lastIndexOf('/')
                String expected = separator < 0 ? '' : path.substring(0, separator).replace('/', '.')
                def declaration = entry.file.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
                String declared = declaration.find() ? declaration.group(1) : ''

                if (declared != expected) {
                    mismatches.add("${sourceSet.name}: ${path} declares '${declared}', expected '${expected}'")
                }
            }
        }
        if (!mismatches.isEmpty()) {
            throw new GradleException('Java packages do not match their source folders:\n' + mismatches.join('\n'))
        }
    }
}

tasks.named('check') { dependsOn verifyJavaSourceLayout }

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('genEclipseRuns'), verifyJavaSourceLayout
    mustRunAfter tasks.named('eclipse')
    doLast {
        List<File> runtime = configurations.runtimeClasspath.files.collect { it.canonicalFile }
        Set<File> optional = configurations.compileClasspath.files.collect { it.canonicalFile } as Set<File>
        optional.removeAll(runtime)
        ['runClient.launch', 'runServer.launch'].each { name ->
            String text = file(name).getText('UTF-8').replace('\\', '/')
            if (!text.contains('MAIN_TYPE" value="net.minecraftforge.launcher.Main"')
                    || !text.contains('StandardVMType/JavaSE-8')
                    || !text.contains('MC_VERSION" value="1.10.2"')
                    || !text.contains('ATTR_EXCLUDE_TEST_CODE')
                    || text.contains('gradleclasspathcontainer') || text.contains('bin/test')
                    || text.contains('slime-launcher-0.2.2.jar')
                    || text.contains('junit-') || text.contains('legacy110-probe')) {
                throw new GradleException("Unsafe production launch: ${name}")
            }
            if (runtime.any { !text.contains(it.path.replace('\\', '/')) }
                    || optional.any { text.contains(it.path.replace('\\', '/')) }) {
                throw new GradleException("Runtime/compile-only separation failed in ${name}")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!text.contains("--${flag} &quot;")) throw new GradleException("Unquoted --${flag} in ${name}")
            }
        }
        String info = file('bin/main/mcmod.info').getText('UTF-8')
        if (info.contains('${version}') || !info.contains(project.version.toString())) {
            throw new GradleException('Eclipse is using unprocessed resources.')
        }
        def classpath = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        List<String> sourcePaths = classpath.classpathentry.findAll { it.@kind == 'src' }.collect { it.@path.text() }
        if (sourcePaths.size() != sourcePaths.unique(false).size()
                || sourcePaths.contains('tools/validation/legacy110')) {
            throw new GradleException('Eclipse retains stale or duplicate source-folder entries.')
        }
        classpath.classpathentry.findAll { it.@kind == 'src' && !it.@path.text().startsWith('src/main/')
                && it.@path.text() != 'build/resources/main' }.each {
            if (!it.attributes.attribute.any { it.@name == 'test' && it.@value == 'true' }) {
                throw new GradleException("Non-production Eclipse source is not marked as test code: ${it.@path}")
            }
        }
    }
}
tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Generates Eclipse metadata and verifies Java 8 production-only launches.'
    dependsOn tasks.named('eclipse'), tasks.named('verifyEclipseProductionClasspath'), 'writeEclipseCompileClasspath'
}

tasks.register('writeEclipseCompileClasspath') {
    group = 'verification'
    description = 'Writes the resolved editor classpath for headless Eclipse compiler checks.'
    doLast {
        File target = layout.buildDirectory.file('ide/compile-classpath.txt').get().asFile
        target.parentFile.mkdirs()
        target.setText(configurations.compileClasspath.asPath, 'UTF-8')
    }
}
