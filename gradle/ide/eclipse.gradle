def eclipseWorkspaceProjectName = project.ext.baseMetalsBuild.eclipseWorkspaceProjectName
def generateOreModels = project.ext.baseMetalsBuild.generateOreModels

eclipse {
    project { name = eclipseWorkspaceProjectName }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            classpath.entries.findAll { entry ->
                String path = entry.path?.replace('\\', '/') ?: ''
                path.startsWith('src/test/') || path.startsWith('src/integrationTest/')
                        || path.startsWith('src/dataGenerator/') || path.endsWith('/modelGenerator')
            }.each { entry -> entry.entryAttributes['test'] = 'true' }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        ['eclipse.preferences.version': '1',
         'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'connection.project.dir': '', 'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'java.home': new File(System.getProperty('java.home')).canonicalPath,
         'override.workspace.settings': 'true'].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by Base Metals Buildship configuration.')
        }
    }
}

def eclipseLaunchPathBoundaries = [
        [option: '-DlegacyClassPath.file=', suffix: ' -DignoreList', joined: true],
        [option: '--cache', suffix: ' --metadata'],
        [option: '--metadata', suffix: ' --to-srg'],
        [option: '--to-srg', suffix: ' --to-obf'],
        [option: '--to-obf', suffix: ' --'],
        [option: '--output', suffix: ' --existing'],
        [option: '--existing', suffix: '"/>']
]

def quoteEclipseLaunchPathArguments = { String contents ->
    eclipseLaunchPathBoundaries.each { Map<String, String> boundary ->
        String option = boundary.option
        String suffix = boundary.suffix
        java.util.regex.Pattern pattern = java.util.regex.Pattern.compile(
                java.util.regex.Pattern.quote(option + (boundary.joined ? '' : ' ')) + '(.+?)' +
                        java.util.regex.Pattern.quote(suffix))
        java.util.regex.Matcher matcher = pattern.matcher(contents)
        if (matcher.find()) {
            String value = matcher.group(1)
            if (!(value.startsWith('&quot;') && value.endsWith('&quot;'))) {
                String replacement = option + (boundary.joined ? '' : ' ') + '&quot;' + value + '&quot;' + suffix
                contents = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(replacement))
            }
        }
    }
    contents
}

def syncForge37EclipseLaunches = tasks.register('syncForge37EclipseLaunches') {
    group = 'ide'
    dependsOn tasks.named('processResources'), tasks.named('prepareDataGeneratorModClasses')
    doLast {
        String mainClass = 'net.minecraftforge.launcher.Main'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String ordinaryModClasses = "${mod_id}%%${mainOutput}"
        File processedResources = layout.buildDirectory.dir('resources/main').get().asFile
        copy { from processedResources; into mainOutput }
        ['Client', 'Server', 'Data'].each { String runName ->
            String modClasses = runName == 'Data'
                    ? "${mod_id}%%${layout.buildDirectory.dir('forge-run-mod-classes/data').get().asFile}"
                    : ordinaryModClasses
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) throw new GradleException("Missing generated Eclipse launch: ${launch}")
            String text = launch.getText('UTF-8')
            if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
                text = text.replace('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                                "    <mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>\r\n" +
                                '</mapAttribute>')
            }
            text = text.replace('<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>"))
            if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                                '</launchConfiguration>')
            }
            launch.setText(text.replace('\r\n', '\n'), 'UTF-8')
        }
        fileTree(projectDir) { include '*.launch' }.files.each { File launch ->
            String text = quoteEclipseLaunchPathArguments(launch.getText('UTF-8'))
            launch.setText(text.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}
tasks.matching { it.name == 'genEclipseRuns' }.configureEach { finalizedBy syncForge37EclipseLaunches }
tasks.matching { it.name == 'eclipse' }.configureEach { finalizedBy syncForge37EclipseLaunches }

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn syncForge37EclipseLaunches
    dependsOn configureEclipseBuildship
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipseClasspath')
    dependsOn tasks.named('isolateEclipseProductionRuns')
    doLast {
        Set<String> synchronizationTasks = eclipse.synchronizationTasks.getDependencies(delegate).collect {
            it.name
        } as Set
        if (synchronizationTasks.contains('generateOreModels')) {
            throw new GradleException('Eclipse refresh must not rewrite source resources')
        }

        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        Properties buildshipPreferences = new Properties()
        prefs.withInputStream { buildshipPreferences.load(it) }
        String expectedGradleHome = gradle.gradleUserHomeDir.canonicalPath
        if (buildshipPreferences.getProperty('connection.gradle.user.home') != expectedGradleHome
                || buildshipPreferences.getProperty('gradle.user.home') != expectedGradleHome
                || buildshipPreferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException("Eclipse Buildship must use Gradle home ${expectedGradleHome}")
        }
        File expectedJavaHome = new File(System.getProperty('java.home')).canonicalFile
        File configuredJavaHome = new File(buildshipPreferences.getProperty('java.home', '')).canonicalFile
        if (configuredJavaHome != expectedJavaHome) {
            throw new GradleException("Eclipse Buildship must use Gradle Java home ${expectedJavaHome}")
        }
        File classpath = file('.classpath')
        if (!classpath.isFile() || !classpath.getText('UTF-8').contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse does not expose generated production resources')
        }
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        def verifyQuotedPaths = { File launch, List<Map<String, String>> boundaries ->
            String contents = launch.getText('UTF-8')
            boundaries.each { Map<String, String> boundary ->
                String option = boundary.option
                String suffix = boundary.suffix
                java.util.regex.Pattern quotedPath = java.util.regex.Pattern.compile(
                        java.util.regex.Pattern.quote(option + (boundary.joined ? '' : ' ') + '&quot;') + '(.+?)' +
                                java.util.regex.Pattern.quote('&quot;' + suffix))
                java.util.regex.Matcher matcher = quotedPath.matcher(contents)
                if (!matcher.find()) {
                    throw new GradleException("${launch.name} does not quote ${option} path")
                }
                File target = new File(matcher.group(1))
                if (!target.exists()) {
                    throw new GradleException("${launch.name} ${option} path does not exist: ${target}")
                }
            }
        }
        ['runClient.launch', 'runServer.launch', 'runData.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("Missing ${name}")
            String contents = launch.getText('UTF-8')
            String expectedModClasses = name == 'runData.launch'
                    ? "${mod_id}%%${layout.buildDirectory.dir('forge-run-mod-classes/data').get().asFile}"
                    : "${mod_id}%%${mainOutput}"
            List<String> forbidden = ['src/test', 'src/integrationTest', 'src/dataGenerator', 'junit-', 'opentest4j-',
                                      'basemetalsprobe', 'C:\\Users\\John']
            List<String> leaked = forbidden.findAll { contents.contains(it) }
            if (!leaked.isEmpty() || !contents.contains('ATTR_EXCLUDE_TEST_CODE')
                    || !contents.contains("PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")
                    || !contents.contains("MOD_CLASSES\" value=\"${expectedModClasses}\"")
                    || !contents.contains('MAIN_TYPE" value="net.minecraftforge.launcher.Main"')
                    || !contents.contains('--main cpw.mods.bootstraplauncher.BootstrapLauncher')) {
                throw new GradleException("${name} is not an isolated Forge 37 launch: ${leaked}")
            }
        }
        List<File> allLaunches = fileTree(projectDir) { include '*.launch' }.files.sort { it.name }
        allLaunches.each { File launch ->
            verifyQuotedPaths(launch, eclipseLaunchPathBoundaries.take(5))
        }
        allLaunches.findAll { it.name.endsWith('Data.launch') }.each { File launch ->
            verifyQuotedPaths(launch, eclipseLaunchPathBoundaries.drop(5))
        }
        String clientLaunch = file('runClient.launch').getText('UTF-8')
        def launcherMatch = clientLaunch =~ /externalArchive=&quot;([^&]+[\\\/]slime-launcher-[^&]+\.jar)&quot;/
        if (!launcherMatch.find()) {
            throw new GradleException('runClient.launch does not reference the ForgeGradle slime launcher')
        }
        File launcherJar = file(launcherMatch.group(1).replace('&amp;', '&'))
        if (!launcherJar.isFile() || !new ZipFile(launcherJar).withCloseable {
            it.getEntry('net/minecraftforge/launcher/Main.class') != null
        }) {
            throw new GradleException("Invalid ForgeGradle slime launcher archive: ${launcherJar}")
        }
        ['META-INF/mods.toml', 'data/basemetals/orespawn/provider.json',
         'data/basemetals/recipes/stone_crackhammer.json'].each { relative ->
            if (!new File(projectDir, "bin/main/${relative}").isFile()) {
                throw new GradleException("Eclipse output is missing ${relative}")
            }
        }
        [file('src/main/resources/META-INF/mods.toml'),
         file('bin/main/META-INF/mods.toml')].each { File metadata ->
            String contents = metadata.getText('UTF-8')
            if (contents.contains('${') || !contents.contains('modId="basemetals"')
                    || !contents.contains("version=\"${project.version}\"")
                    || !contents.contains('[[dependencies.basemetals]]')) {
                throw new GradleException("Eclipse mod metadata is unresolved or has the wrong identity: ${metadata}")
            }
        }
        [file('src/main/resources/pack.mcmeta'), file('bin/main/pack.mcmeta')].each { File metadata ->
            if (metadata.getText('UTF-8').contains('${')) {
                throw new GradleException("Eclipse pack metadata is unresolved: ${metadata}")
            }
        }
    }
}
