// Eclipse support repairs ForgeGradle's generated launches without changing product dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def eclipseXmlEscape = { String value ->
    value.replace('&', '&amp;')
            .replace('"', '&quot;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
}

def eclipseArchiveLaunchEntry = { File archive ->
    String memento = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' \
            + '<runtimeClasspathEntry externalArchive="' + archive.canonicalPath \
            + '" type="2" path="5" />'
    '    <listEntry value="' + eclipseXmlEscape(memento) + '"/>'
}

def replaceBuildshipLaunchClasspath = { String contents, Collection<File> archives ->
    List<String> lines = contents.replace('\r\n', '\n').split('\n', -1) as List<String>
    List<Integer> buildshipLines = (0..<lines.size()).findAll {
        lines[it].contains('org.eclipse.buildship.core.gradleclasspathcontainer')
    }
    if (buildshipLines.size() != 1) {
        throw new GradleException("Expected one Buildship launch classpath entry, found ${buildshipLines.size()}")
    }
    List<File> uniqueArchives = archives.collect { it.canonicalFile }
            .unique { File archive -> archive.path.toLowerCase(Locale.ROOT) }
    List<File> missingArchives = uniqueArchives.findAll { !it.isFile() }
    if (!missingArchives.isEmpty()) {
        throw new GradleException("Eclipse launch archives are missing: ${missingArchives}")
    }
    lines[buildshipLines[0]] = uniqueArchives.collect(eclipseArchiveLaunchEntry).join('\n')
    lines.join('\n')
}

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.withXml { provider ->
            Node classpath = provider.asNode()
            classpath.classpathentry.findAll { it.@kind == 'lib' }.each {
                classpath.remove(it)
            }
            if (!classpath.classpathentry.any {
                    it.@kind == 'con' && it.@path == 'org.eclipse.buildship.core.gradleclasspathcontainer'
            }) {
                classpath.appendNode('classpathentry', [
                        kind: 'con', path: 'org.eclipse.buildship.core.gradleclasspathcontainer'
                ])
            }
        }
    }
    synchronizationTasks 'genEclipseRuns'
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Configures Buildship to use the wrapper and this invocation\'s Gradle cache.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        Map<String, String> required = [
                'eclipse.preferences.version'     : '1',
                'connection.gradle.distribution' : 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'    : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'         : '',
                'gradle.user.home'                : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'    : 'true'
        ]
        required.each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by configureEclipseBuildship.')
        }
    }
}

tasks.named('genEclipseRuns') {
    finalizedBy configureEclipseBuildship, 'isolateEclipseProductionRuns'
}

tasks.named('eclipse') {
    dependsOn tasks.named('genEclipseRuns')
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Repairs Forge 1.12 launches and replaces compile-only Buildship entries with runtime jars.'
    doLast {
        List<File> runtimeArchives = configurations.runtimeClasspath.files as List<File>
        ['BaseMetals_Client.launch', 'BaseMetals_Server.launch'].each { name ->
            File legacy = file(name)
            if (legacy.isFile() && legacy.getText('UTF-8').contains('MAIN_TYPE" value="GradleStart')) {
                if (!legacy.delete()) {
                    throw new GradleException("Could not retire obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            def programArguments = contents =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                if (valueStart < 0) {
                    throw new GradleException("ForgeGradle omitted --${flag} from ${name}")
                }
                valueStart += prefix.length()
                int valueEnd = arguments.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("ForgeGradle generated an unterminated --${flag} path in ${name}")
                }
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            contents = contents.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                                + System.lineSeparator() + '</launchConfiguration>')
            }
            String eclipseModClasses = file('bin/main').absolutePath
            if (contents.contains('key="MOD_CLASSES"')) {
                contents = contents.replaceAll(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                        java.util.regex.Matcher.quoteReplacement(
                                "<mapEntry key=\"MOD_CLASSES\" value=\"${eclipseModClasses}\"/>"))
            }
            contents = contents.replaceAll(/<mapEntry key="MC_VERSION" value="[^"]*"\/>/,
                    '<mapEntry key="MC_VERSION" value="1.12.2"/>')
            contents = replaceBuildshipLaunchClasspath(contents, runtimeArchives)
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Java 8, launcher identity, path quoting, merged output, and test isolation.'
    dependsOn tasks.named('genEclipseRuns')
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefs.isFile()) {
            throw new GradleException("Missing Eclipse Buildship configuration: ${prefs}")
        }
        Properties buildship = new Properties()
        prefs.withInputStream { buildship.load(it) }
        if (buildship.getProperty('connection.gradle.distribution') != 'GRADLE_DISTRIBUTION(WRAPPER)'
                || file(buildship.getProperty('connection.gradle.user.home')).canonicalFile
                != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Buildship does not use the wrapper and selected Gradle cache')
        }
        String projectMetadata = file('.project').getText('UTF-8')
        if (!projectMetadata.contains('org.eclipse.buildship.core.gradleprojectnature')
                || !projectMetadata.contains('org.eclipse.buildship.core.gradleprojectbuilder')) {
            throw new GradleException('Eclipse project metadata is missing Buildship integration')
        }
        String eclipseClasspath = file('.classpath').getText('UTF-8').replace('\\', '/')
        if (!eclipseClasspath.contains('org.eclipse.buildship.core.gradleclasspathcontainer')
                || eclipseClasspath.contains('<classpathentry kind="lib"')
                || eclipseClasspath ==~ /(?s).*<classpathentry[^>]+path="[A-Za-z]:[\\\/].*/) {
            throw new GradleException('Eclipse must expose dependencies through the Buildship container only')
        }
        List<File> runtimeArchives = configurations.runtimeClasspath.files.collect {
            it.canonicalFile
        }
        Set<File> compileOnlyArchives = configurations.compileClasspath.files.collect {
            it.canonicalFile
        } as Set<File>
        compileOnlyArchives.removeAll(runtimeArchives)
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            String contents = launch.getText('UTF-8').replace('\\', '/')
            List<String> forbidden = [
                    'src/test', 'bin/test', 'build/classes/java/test',
                    'junit-', 'mockito-', 'byte-buddy', 'objenesis'
            ].findAll { contents.contains(it) }
            if (!forbidden.isEmpty()) {
                throw new GradleException("${name} exposes test code/dependencies: ${forbidden}")
            }
            if (!contents.contains('MAIN_TYPE" value="net.minecraftforge.launcher.Main"')
                    || !contents.contains('JRE_CONTAINER/org.eclipse.jdt.internal.debug.ui.launcher.StandardVMType/JavaSE-8')
                    || !contents.contains('ATTR_EXCLUDE_TEST_CODE')
                    || contents.contains('org.eclipse.buildship.core.gradleclasspathcontainer')
                    || !contents.contains('PROJECT_ATTR" value="BaseMetals"')
                    || contents.contains('${MC_VERSION}')
                    || !contents.contains('MC_VERSION" value="1.12.2"')) {
                throw new GradleException("${name} has the wrong launcher, JRE, classpath, project, or Minecraft version")
            }
            Set<File> missingRuntime = runtimeArchives.findAll {
                !contents.contains(it.canonicalPath.replace('\\', '/'))
            }
            Set<File> leakedCompileOnly = compileOnlyArchives.findAll {
                contents.contains(it.canonicalPath.replace('\\', '/'))
            }
            if (!missingRuntime.isEmpty() || !leakedCompileOnly.isEmpty()) {
                throw new GradleException("${name} runtime isolation failed; missing=${missingRuntime}, "
                        + "compileOnly=${leakedCompileOnly}")
            }
            List<Integer> runtimePositions = runtimeArchives.collect {
                contents.indexOf(it.canonicalPath.replace('\\', '/'))
            }
            List<Integer> sortedRuntimePositions = new ArrayList<>(runtimePositions)
            sortedRuntimePositions.sort()
            if (runtimePositions != sortedRuntimePositions) {
                throw new GradleException("${name} does not preserve Gradle's order-sensitive runtime classpath")
            }
            String expectedOreSpawnName = "mmd-orespawn-${project.orespawn4_curse_project_id}-${project.orespawn4_curse_file_id}-renamed.jar"
            List<File> oreSpawnRuntime = runtimeArchives.findAll { it.name == expectedOreSpawnName }
            if (oreSpawnRuntime.size() != 1
                    || !contents.contains(oreSpawnRuntime.first().canonicalPath.replace('\\', '/'))
                    || contents.contains(project.orespawn3_version.toString())) {
                throw new GradleException("${name} does not use only the remapped OreSpawn 4 dependency")
            }
            String expectedModClasses = file('bin/main').absolutePath.replace('\\', '/')
            if (!contents.contains('MOD_CLASSES" value="' + expectedModClasses)) {
                throw new GradleException("${name} does not use Eclipse's merged production output")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!contents.contains("--${flag} &quot;")) {
                    throw new GradleException("${name} does not quote its --${flag} path")
                }
            }
        }
    }
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Generates Forge launches and Eclipse metadata, then verifies production isolation.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('verifyEclipseProductionClasspath')
}

tasks.named('verifyEclipseProductionClasspath') {
    mustRunAfter tasks.named('eclipse')
}
