modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SkyBlade1978/BaseMetals/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/base-metals"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="orespawn"
mandatory=true
versionRange="[4.1.0.119041,5.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
mandatory=false
versionRange="[10.2,11)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thermal_expansion"
mandatory=false
versionRange="[9,10)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tconstruct"
mandatory=false
versionRange="[3.7,4)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="enderio_machines"
mandatory=false
# Maven qualifier ordering places commit-suffixed 6.0.0 alpha builds below
# the bare 6.0.0-alpha token. This range admits the intended major-6 alpha
# line while still rejecting every other Ender IO major version.
versionRange="(5,7)"
ordering="AFTER"
side="BOTH"
