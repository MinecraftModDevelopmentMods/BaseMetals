# Memory for Forge's build tools. Gradle runs on Java 17; Minecraft runs on Java 8.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=false
net.minecraftforge.gradle.merge-source-sets=false

# Minecraft, Forge and mappings must describe the same game version.
minecraft_version=1.14.4
minecraft_version_range=[1.14.4]
forge_version=28.2.26
forge_installer_sha256=E68A0E2D589B2954C5D109A04B80747AC8C061ACABE074DB1607F9C2FD7D2CE1

# Target and Java versions used by release checks and publishing.
loader_name=forge
loader_code=1
java_version=8
java_toolchain_version=8.0.502+7
gradle_java_version=17
curseforge_project_id=240967

# Pin the OreSpawn release we build and test against.
orespawn_version=4.1.0.114041
orespawn_curse_project_id=245586
orespawn_curse_file_id=9041431
orespawn_sha256=7691C1AE7C6AC890A2CC785F3EEF54A1255D61E4CFCF5661D67CB1609CFC41C6

# Versions accepted when players load the mod.
forge_version_range=[28,)
loader_version_range=[28,)

# MCP mappings for Forge 28.
mapping_channel=snapshot
mapping_version=20190719-1.14.3
mcp_version=20190829.143755

# Mod identity. Keep mod_id unchanged so existing saves still load.
mod_id=basemetals
mod_name=Base Metals
mod_license=LGPL-2.1
mod_version=3.0.1.114041

# Maven coordinates and credits.
mod_group=zone.moddev.mc.basemetals
mod_authors=Cyanobacterium, jriwanek, dshadowwolf, GetDizzy611, SkyBlade1978, the MMD Team
mod_description=Adds real and fantasy metals, alloys, tools and armour. Crush ores with Crack Hammers, blend new metals and discover ores placed by OreSpawn.
