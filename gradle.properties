# Memory for Forge's build tools. Gradle runs on Java 17; Minecraft runs on Java 16.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=false
net.minecraftforge.gradle.merge-source-sets=false

# Minecraft, Forge and mappings must describe the same game version.
minecraft_version=1.17.1
minecraft_version_range=[1.17.1]
forge_version=37.1.1
forge_installer_sha256=31F2319B1B9CA491AACCC020887240F8524A4FF2A8E0F8B795E17E889CBC043B

# Target and Java versions used by release checks and publishing.
loader_name=forge
loader_code=1
java_version=16
java_toolchain_version=16.0.2+7
gradle_java_version=17
curseforge_project_id=240967

# Exact OreSpawn release used for development, CI and packaged tests.
orespawn_dependency_mode=release
orespawn_version=4.1.0.117011
orespawn_curse_project_id=245586
orespawn_curse_file_id=9088186
orespawn_sha256=1BDEDCBB179CB5A3B169E5C8A6B301E3888AE15B94108B0AEC627D705CFAD833

# Versions accepted when players load the mod.
forge_version_range=[37,38)
loader_version_range=[37,38)

# MCP mappings for Forge 37.
mapping_channel=official
mapping_version=1.17.1
mcp_version=20210706.113038

# Mod identity. Keep mod_id unchanged so existing saves still load.
mod_id=basemetals
mod_name=Base Metals
mod_license=LGPL-2.1
mod_version=3.1.0.117011

# Maven coordinates and credits.
mod_group=zone.moddev.mc.basemetals
mod_authors=Cyanobacterium, jriwanek, dshadowwolf, GetDizzy611, SkyBlade1978, the MMD Team
mod_description=Adds real and fantasy metals, alloys, tools and armour. Crush ores with Crack Hammers, blend new metals and discover ores placed by OreSpawn.
